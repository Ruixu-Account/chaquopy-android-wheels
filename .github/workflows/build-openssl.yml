name: Probe OpenSSL for Android arm64

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NDK_VERSION: "27.3.13750724"
      ANDROID_API: "24"
      OPENSSL_VERSION: "3.5.0"

    steps:
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl wget unzip file

      - name: Pre-install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK_VERSION}" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Download OpenSSL source
        run: |
          set -euo pipefail
          wget -q "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -O /tmp/openssl.tar.gz
          ls -la /tmp/openssl.tar.gz
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          mv /tmp/openssl-${OPENSSL_VERSION} /tmp/openssl-src
          ls /tmp/openssl-src | head

      - name: Configure OpenSSL for aarch64 Android
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          export CC="aarch64-linux-android${ANDROID_API}-clang"
          export CXX="aarch64-linux-android${ANDROID_API}-clang++"
          export AR="llvm-ar"
          export RANLIB="llvm-ranlib"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          cd /tmp/openssl-src
          # android-arm64 是 OpenSSL 自带的 target
          ./Configure android-arm64 \
            -D__ANDROID_API__=${ANDROID_API} \
            --prefix=/tmp/openssl-install \
            --openssldir=/tmp/openssl-install/ssl \
            no-shared \
            no-tests \
            no-engine \
            no-dso \
            no-ui-console \
            2>&1 | tee /tmp/openssl-config.log
          echo "=== config summary ==="
          grep -E "^(Configuring|CC|CXX|AR)" /tmp/openssl-config.log | head -20

      - name: Build OpenSSL
        run: |
          set -euo pipefail
          cd /tmp/openssl-src
          make -j4 2>&1 | tail -40
          echo "=== build done ==="

      - name: Install OpenSSL
        run: |
          set -euo pipefail
          cd /tmp/openssl-src
          make install_sw 2>&1 | tail -20
          echo "=== installed ==="
          find /tmp/openssl-install -type f | head -30
          echo ""
          echo "=== key files ==="
          ls -la /tmp/openssl-install/lib/ || true
          ls -la /tmp/openssl-install/include/openssl/ | head || true

      - name: Verify OpenSSL arch
        run: |
          set -euo pipefail
          for f in /tmp/openssl-install/lib/libcrypto.a /tmp/openssl-install/lib/libssl.a; do
            echo "--- $f ---"
            file "$f"
          done
          echo ""
          echo "=== sample symbol from libcrypto.a ==="
          llvm-ar t /tmp/openssl-install/lib/libcrypto.a 2>/dev/null | head -5 || ar t /tmp/openssl-install/lib/libcrypto.a | head -5

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          $HOME/.cargo/bin/rustup target add aarch64-linux-android
          $HOME/.cargo/bin/rustc --version

      - name: Write minimal Rust test
        run: |
          mkdir -p /tmp/ossl-test/src
          cd /tmp/ossl-test
          cat > Cargo.toml <<'EOF'
          [package]
          name = "ossl-test"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          openssl-sys = "0.9"

          [lib]
          crate-type = ["cdylib"]
          EOF
          cat > src/lib.rs <<'EOF'
          #[no_mangle]
          pub extern "C" fn probe_openssl() -> u64 {
              unsafe { openssl_sys::OpenSSL_version_num() as u64 }
          }
          EOF
          ls -la

      - name: Build Rust test against Android OpenSSL
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$HOME/.cargo/bin:$PATH"
          export CC_aarch64_linux_android="aarch64-linux-android${ANDROID_API}-clang"
          export CXX_aarch64_linux_android="aarch64-linux-android${ANDROID_API}-clang++"
          export AR_aarch64_linux_android="llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="aarch64-linux-android${ANDROID_API}-clang"
          export OPENSSL_DIR=/tmp/openssl-install
          export OPENSSL_STATIC=1
          export OPENSSL_LIB_DIR=/tmp/openssl-install/lib
          export OPENSSL_INCLUDE_DIR=/tmp/openssl-install/include

          cd /tmp/ossl-test
          cargo build --release --target aarch64-linux-android 2>&1 | tee /tmp/cargo-build.log
          echo ""
          echo "=== build result ==="
          find target/aarch64-linux-android/release -name "*.so" -exec ls -la {} \;
          find target/aarch64-linux-android/release -name "*.so" -exec file {} \;

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs
          path: |
            /tmp/openssl-config.log
            /tmp/cargo-build.log
          if-no-files-found: ignore
