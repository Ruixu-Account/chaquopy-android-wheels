name: Build pyarrow for Android

on:
  workflow_dispatch:
    inputs:
      pyarrow_version:
        description: 'pyarrow 版本（如 25.0.1）'
        required: true
        default: '25.0.1'
      python:
        description: 'Python 版本'
        required: true
        default: '3.12'
        type: choice
        options:
          - '3.12'
      python_target_version:
        description: 'Chaquopy Python target 版本'
        required: true
        default: '3.12.12-0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.11

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip patchelf jq zip ninja-build swig cmake binutils file

      - name: Clone Chaquopy 17.0.0
        run: |
          git clone --depth 1 --branch 17.0.0 --recurse-submodules \
            https://github.com/chaquo/chaquopy.git /opt/chaquopy
          cd /opt/chaquopy
          git submodule update --init --recursive || true

      - name: Install Chaquopy build requirements
        run: |
          pip install -r /opt/chaquopy/server/pypi/requirements.txt

      - name: Set Android env vars
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Pre-install NDK r27c
        continue-on-error: true
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724" || true

      - name: Patch Chaquopy build-wheel.py
        run: |
          python3 - <<'PY'
          p = "/opt/chaquopy/server/pypi/build-wheel.py"
          src = open(p).read()

          old1 = 'python_executable=f"{self.build_env}/bin/python")'
          new1 = 'python_executable=f"{self.build_env}/bin/python{self.python}")'
          if old1 not in src:
              raise SystemExit("patch1 not found")
          src = src.replace(old1, new1, 1)

          old2 = ('            "PYO3_CROSS_PYTHON_VERSION": self.python,\n'
                  '        })')
          new2 = ('            "PYO3_CROSS_PYTHON_VERSION": self.python,\n'
                  '            "PYO3_CROSS_LIB_DIR": f"{self.host_env}/chaquopy/lib",\n'
                  '        })')
          if old2 not in src:
              raise SystemExit("patch2 not found")
          src = src.replace(old2, new2, 1)

          # pyarrow 25.x 使用 scikit-build-core，走 cmake.define.* 传参
          old3 = '            return self.builder.build("wheel", "dist")'
          new3 = ('            py_include = f"{self.host_env}/chaquopy/include/python{self.python}"\n'
                  '            py_lib = f"{self.host_env}/chaquopy/lib/libpython{self.python}.so"\n'
                  '            host_python = "/opt/hostedtoolcache/Python/3.12.15/x64/bin/python3.12"\n'
                  '            import os\n'
                  '            if not os.path.exists(host_python):\n'
                  '                import sys\n'
                  '                host_python = sys.executable\n'
                  '            return self.builder.build(\n'
                  '                "wheel", "dist",\n'
                  '                config_settings={\n'
                  '                    "cmake.define.ARROW_BUILD_TESTS": "OFF",\n'
                  '                    "cmake.define.ARROW_BUILD_BENCHMARKS": "OFF",\n'
                  '                    "cmake.define.ARROW_BUILD_EXAMPLES": "OFF",\n'
                  '                    "cmake.define.ARROW_BUILD_STATIC": "ON",\n'
                  '                    "cmake.define.ARROW_BUILD_SHARED": "ON",\n'
                  '                    "cmake.define.ARROW_DEPENDENCY_SOURCE": "BUNDLED",\n'
                  '                    "cmake.define.ARROW_JEMALLOC": "OFF",\n'
                  '                    "cmake.define.ARROW_SIMD_LEVEL": "NONE",\n'
                  '                    "cmake.define.ARROW_RUNTIME_SIMD_LEVEL": "NONE",\n'
                  '                    "cmake.define.ARROW_CPU_FLAG": "ARMV8",\n'
                  '                    "cmake.define.ARROW_COMPUTE": "ON",\n'
                  '                    "cmake.define.ARROW_CSV": "OFF",\n'
                  '                    "cmake.define.ARROW_JSON": "OFF",\n'
                  '                    "cmake.define.ARROW_PARQUET": "ON",\n'
                  '                    "cmake.define.ARROW_DATASET": "OFF",\n'
                  '                    "cmake.define.ARROW_WITH_BROTLI": "OFF",\n'
                  '                    "cmake.define.ARROW_WITH_BZ2": "OFF",\n'
                  '                    "cmake.define.ARROW_WITH_LZ4": "OFF",\n'
                  '                    "cmake.define.ARROW_WITH_SNAPPY": "OFF",\n'
                  '                    "cmake.define.ARROW_WITH_ZLIB": "ON",\n'
                  '                    "cmake.define.ARROW_WITH_ZSTD": "OFF",\n'
                  '                    "cmake.define.ARROW_WITH_UTF8PROC": "OFF",\n'
                  '                    "cmake.define.ARROW_WITH_RE2": "OFF",\n'
                  '                    "cmake.define.ARROW_WITH_GRPC": "OFF",\n'
                  '                    "cmake.define.ARROW_WITH_THRIFT": "OFF",\n'
                  '                    "cmake.define.ARROW_WITH_PROTOBUF": "ON",\n'
                  '                    "cmake.define.ARROW_WITH_BOOST": "OFF",\n'
                  '                    "cmake.define.ARROW_S3": "OFF",\n'
                  '                    "cmake.define.ARROW_GCS": "OFF",\n'
                  '                    "cmake.define.ARROW_HDFS": "OFF",\n'
                  '                    "cmake.define.ARROW_FLIGHT": "OFF",\n'
                  '                    "cmake.define.ARROW_GANDIVA": "OFF",\n'
                  '                    "cmake.define.ARROW_ACERO": "OFF",\n'
                  '                    "cmake.define.ARROW_PYTHON": "ON",\n'
                  '                    "cmake.define.Python_EXECUTABLE": host_python,\n'
                  '                    "cmake.define.Python_INCLUDE_DIR": py_include,\n'
                  '                    "cmake.define.Python_LIBRARY": py_lib,\n'
                  '                }\n'
                  '            )')
          if old3 not in src:
              raise SystemExit("patch3 not found")
          src = src.replace(old3, new3, 1)

          open(p, "w").write(src)
          print("=== 3 patches ok ===")
          PY
          grep -n "python_executable=" /opt/chaquopy/server/pypi/build-wheel.py
          grep -n "cmake.define.ARROW_DEPENDENCY_SOURCE" /opt/chaquopy/server/pypi/build-wheel.py

      - name: Download Android Python target
        run: |
          cd /opt/chaquopy
          ./target/download-target.sh \
            maven/com/chaquo/python/target/${{ inputs.python_target_version }}
          find /opt/chaquopy/maven -name "*.zip" -exec ls -la {} \;

      - name: Inject sysconfigdata
        run: |
          ZIP="/opt/chaquopy/maven/com/chaquo/python/target/${{ inputs.python_target_version }}/target-${{ inputs.python_target_version }}-arm64-v8a.zip"
          PY_VER="${{ inputs.python }}"
          PY_VER_NODOT="${PY_VER//./}"
          INJ=/tmp/inject_sysconfig
          rm -rf "$INJ"
          mkdir -p "$INJ/jniLibs/arm64-v8a"
          cat > "$INJ/jniLibs/arm64-v8a/_sysconfigdata__linux_aarch64-linux-android.py" <<EOF
          build_time_vars = {
              "SOABI": "cpython-${PY_VER_NODOT}-aarch64-linux-android",
              "EXT_SUFFIX": ".cpython-${PY_VER_NODOT}-aarch64-linux-android.so",
              "VERSION": "${PY_VER}",
              "LDVERSION": "${PY_VER}",
              "py_version_nodot": "${PY_VER_NODOT}",
              "py_version_short": "${PY_VER}",
              "Py_ENABLE_SHARED": 1,
              "Py_DEBUG": 0,
              "Py_REF_DEBUG": 0,
              "abiflags": "",
              "prefix": "/data/data/com.astrbot.app/files/astrbot_root",
              "exec_prefix": "/data/data/com.astrbot.app/files/astrbot_root",
              "CC": "aarch64-linux-android24-clang",
              "CXX": "aarch64-linux-android24-clang++",
              "LDSHARED": "aarch64-linux-android24-clang -shared",
          }
          EOF
          cd "$INJ"
          zip "$ZIP" jniLibs/arm64-v8a/_sysconfigdata__linux_aarch64-linux-android.py
          unzip -l "$ZIP" | grep sysconfigdata

      - name: Download dependencies
        run: |
          DIST_DIR="/opt/chaquopy/server/pypi/dist"

          mkdir -p "$DIST_DIR/numpy"
          wget -q "https://github.com/Ruixu-Account/chaquopy-android-wheels/releases/download/latest/numpy-2.5.3-0-cp312-cp312-android_24_arm64_v8a.whl" \
            -O "$DIST_DIR/numpy/numpy-2.5.3-0-cp312-cp312-android_24_arm64_v8a.whl"

          mkdir -p "$DIST_DIR/chaquopy-libcxx"
          wget -q "https://chaquo.com/pypi-13.1/chaquopy-libcxx/chaquopy_libcxx-180000-0-py3-none-android_24_arm64_v8a.whl" \
            -O "$DIST_DIR/chaquopy-libcxx/chaquopy_libcxx-180000-0-py3-none-android_24_arm64_v8a.whl"

          echo "=== dist 目录 ==="
          find "$DIST_DIR" -name "*.whl" -exec ls -la {} \;

      - name: Clone and patch pyarrow source
        run: |
          cd /tmp
          rm -rf arrow-src
          git clone --depth 1 --branch apache-arrow-${{ inputs.pyarrow_version }} \
            https://github.com/apache/arrow.git arrow-src
          cd arrow-src

          echo "=== pyarrow 版本 ==="
          grep -n "version" python/pyproject.toml | head -5 || true

          echo "=== BEFORE: find_package(Python) 在 python/CMakeLists.txt ==="
          grep -n "find_package(Python\|find_package(NumPy\|Python3_NumPy\|NumPy_INCLUDE" python/CMakeLists.txt || echo "(not found)"

          python3 - <<'PY'
          import re

          path = "python/CMakeLists.txt"
          with open(path) as f:
              content = f.read()

          patterns = [
              re.compile(r'find_package\s*\(\s*Python3?\b[^)]*\)', re.MULTILINE | re.DOTALL),
              re.compile(r'find_package\s*\(\s*NumPy\b[^)]*\)', re.MULTILINE | re.DOTALL),
          ]

          all_matches = []
          for p in patterns:
              all_matches.extend(p.findall(content))

          print(f"FOUND {len(all_matches)} find_package statements")
          for m in all_matches:
              print(f"  {m!r}")

          if not all_matches:
              raise SystemExit("FATAL: no find_package(Python/NumPy) found in python/CMakeLists.txt")

          replacement = (
              '# === Chaquopy patch: 手工设置 Python/NumPy 路径，绕过 FindPython ===\n'
              'get_filename_component(_py_inc_parent "${Python_INCLUDE_DIRS}" DIRECTORY)\n'
              'get_filename_component(_py_chaquopy "${_py_inc_parent}" DIRECTORY)\n'
              'get_filename_component(_host_env "${_py_chaquopy}" DIRECTORY)\n'
              'set(Python_NumPy_INCLUDE_DIRS "${_host_env}/numpy/_core/include")\n'
              'message(STATUS "Chaquopy: Python_INCLUDE_DIRS = ${Python_INCLUDE_DIRS}")\n'
              'message(STATUS "Chaquopy: Python_NumPy_INCLUDE_DIRS = ${Python_NumPy_INCLUDE_DIRS}")\n'
              'if(NOT EXISTS "${Python_NumPy_INCLUDE_DIRS}")\n'
              '  message(FATAL_ERROR "Chaquopy: numpy include dir does not exist: ${Python_NumPy_INCLUDE_DIRS}")\n'
              'endif()\n'
              'if(NOT TARGET Python::NumPy)\n'
              '  add_library(Python::NumPy INTERFACE IMPORTED)\n'
              '  set_target_properties(Python::NumPy PROPERTIES\n'
              '    INTERFACE_INCLUDE_DIRECTORIES "${Python_NumPy_INCLUDE_DIRS}")\n'
              '  message(STATUS "Chaquopy: created fake Python::NumPy target")\n'
              'endif()\n'
              '# === /Chaquopy patch ===\n'
          )

          for p in patterns:
              content = p.sub(replacement, content, count=1)

          with open(path, "w") as f:
              f.write(content)
          print("OK: patched python/CMakeLists.txt")
          PY

          echo "=== AFTER: python/CMakeLists.txt ==="
          grep -n "Chaquopy patch\|Python_NumPy_INCLUDE_DIRS\|Python::NumPy" python/CMakeLists.txt || echo "(not found)"

      - name: Prepare pyarrow recipe
        run: |
          RECIPE="/opt/chaquopy/server/pypi/packages/astrbot-pyarrow"
          rm -rf "$RECIPE"
          mkdir -p "$RECIPE"

          cat > "$RECIPE/meta.yaml" <<'EOF'
          package:
            name: pyarrow
            version: "${{ inputs.pyarrow_version }}"
          source:
            path: /tmp/arrow-src
          build:
            number: 0
          requirements:
            build:
              - cmake 3.24.0
              - ninja 1.11.1
              - scikit-build-core 0.10.7
              - numpy 2.5.3
              - cython 3.0.11
            host:
              - python
              - numpy 2.5.3
              - chaquopy-libcxx 180000
          EOF

          echo "=== meta.yaml ==="
          cat "$RECIPE/meta.yaml"

      - name: Build pyarrow
        run: |
          cd /opt/chaquopy/server/pypi
          python build-wheel.py \
            --python ${{ inputs.python }} \
            --abi arm64-v8a \
            /opt/chaquopy/server/pypi/packages/astrbot-pyarrow 2>&1 | tee /tmp/build-pyarrow.log
          echo "=== last 120 lines ==="
          tail -120 /tmp/build-pyarrow.log

      # ============================================================
      # 新增：依赖检查
      # 拆开 wheel，把所有 .so 的 NEEDED / SONAME 列出来，
      # 并汇总去重，最后检查有没有可疑的 glibc / x86 依赖。
      # ============================================================
      - name: Check shared library dependencies
        if: success()
        run: |
          set -euo pipefail
          DIST_DIR="/opt/chaquopy/server/pypi/dist/pyarrow"
          WHEEL=$(find "$DIST_DIR" -name "*android_*.whl" | head -1)
          if [ -z "$WHEEL" ]; then
            echo "❌ No android wheel found in $DIST_DIR"
            exit 1
          fi
          echo "=== Analyzing wheel: $WHEEL ==="
          CHECK_DIR=/tmp/pyarrow-check
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$WHEEL" -d "$CHECK_DIR"

          echo ""
          echo "=== [1] All .so files in wheel ==="
          find "$CHECK_DIR" -name "*.so" -type f | sort | sed "s|$CHECK_DIR/||"

          echo ""
          echo "=== [2] Per-file NEEDED / SONAME ==="
          find "$CHECK_DIR" -name "*.so" -type f -exec sh -c '
            for so; do
              echo "--- ${so#'"$CHECK_DIR"'/} ---"
              readelf -d "$so" 2>/dev/null | grep -E "NEEDED|SONAME" || echo "  (no dynamic section)"
            done
          ' _ {} \;

          echo ""
          echo "=== [3] Aggregated NEEDED (unique, sorted) ==="
          find "$CHECK_DIR" -name "*.so" -type f -exec sh -c '
            readelf -d "$1" 2>/dev/null | grep "NEEDED" || true
          ' _ {} \; | sed -E 's/.*\[(.*)\]/\1/' | sort -u

          echo ""
          echo "=== [4] Aggregated SONAME (unique, sorted) ==="
          find "$CHECK_DIR" -name "*.so" -type f -exec sh -c '
            readelf -d "$1" 2>/dev/null | grep "SONAME" || true
          ' _ {} \; | sed -E 's/.*\[(.*)\]/\1/' | sort -u

          echo ""
          echo "=== [5] Suspicious glibc / gfortran / libstdc++ refs ==="
          SUSPICIOUS=0
          for pat in 'libgfortran\.so\.3' 'libpthread\.so\.0' 'libdl\.so\.1' 'libstdc\+\+\.so\.6' 'libgcc_s\.so\.1'; do
            HITS=$(find "$CHECK_DIR" -name "*.so" -type f -exec sh -c "
              readelf -d \"\$1\" 2>/dev/null | grep -E '$pat' || true
            " _ {} \; | sort -u)
            if [ -n "$HITS" ]; then
              echo "⚠️  Pattern '$pat' found:"
              echo "$HITS" | sed 's/^/    /'
              SUSPICIOUS=$((SUSPICIOUS + 1))
            fi
          done
          if [ "$SUSPICIOUS" -eq 0 ]; then
            echo "✅ No suspicious glibc/gfortran/libstdc++ refs found"
          fi

          echo ""
          echo "=== [6] File architecture check (should be aarch64) ==="
          find "$CHECK_DIR" -name "*.so" -type f -exec file {} \; | sed "s|$CHECK_DIR/||" | head -40

          echo ""
          echo "=== [7] pyarrow version metadata ==="
          find "$CHECK_DIR" -name "*.dist-info" -type d -exec sh -c '
            for d; do
              echo "--- ${d#'"$CHECK_DIR"'/} ---"
              cat "$d/METADATA" 2>/dev/null | grep -E "^(Name|Version):" || true
            done
          ' _ {} \;

      - name: List built wheels
        if: always()
        run: |
          find /opt/chaquopy/server/pypi/dist/pyarrow -name "*.whl" -exec ls -la {} \; || true

      - name: Collect android wheel
        if: success()
        run: |
          mkdir -p /tmp/all-wheels
          find /opt/chaquopy/server/pypi/dist/pyarrow -name "*android_*.whl" \
            -exec cp -f {} /tmp/all-wheels/ \;
          ls -la /tmp/all-wheels/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pyarrow-${{ inputs.pyarrow_version }}-android
          path: /tmp/all-wheels/*.whl
          if-no-files-found: error
          retention-days: 90

      - name: Upload to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: /tmp/all-wheels/*.whl
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
