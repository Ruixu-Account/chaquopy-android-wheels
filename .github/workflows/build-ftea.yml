name: Build ftea for Android arm64

on:
  workflow_dispatch:
    inputs:
      ftea_version:
        description: 'ftea 版本（用于 wheel 文件名，需与源码 __init__.py 一致）'
        required: true
        default: '0.1.10'
      ftea_commit:
        description: 'ftea Git commit hash（建议 40 位完整 hash 以冻结版本）'
        required: true
        default: '43d4f6a735b0da1b1dd4157845eb66140effdc2c'
      python_target_version:
        description: 'Chaquopy Python target 版本'
        required: true
        default: '3.12.12-0'

permissions:
  contents: write

concurrency:
  group: build-ftea-${{ github.ref }}
  cancel-in-progress: false

env:
  CHAQUOPY_VERSION: "17.0.0"
  CHAQUOPY_ROOT: /opt/chaquopy
  NDK_VERSION: "27.3.13750724"
  ANDROID_API_LEVEL: "24"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.11

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential wget unzip patchelf jq zip ninja-build file

      - name: Set Android env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Pre-install NDK r27c
        continue-on-error: true
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK_VERSION}" || true

      - name: Configure git for submodules
        run: |
          git config --global submodule.recurse true

      - name: Clone Chaquopy ${{ env.CHAQUOPY_VERSION }}
        run: |
          set -euo pipefail
          if [ -d "$CHAQUOPY_ROOT" ] && [ ! -d "$CHAQUOPY_ROOT/.git" ]; then
            rm -rf "$CHAQUOPY_ROOT"
          fi
          git clone --depth 1 --branch $CHAQUOPY_VERSION --recurse-submodules \
            https://github.com/chaquo/chaquopy.git $CHAQUOPY_ROOT
          cd $CHAQUOPY_ROOT
          git submodule update --init --recursive || true

      - name: Install Chaquopy build requirements
        run: |
          which python
          python --version
          pip install -r $CHAQUOPY_ROOT/server/pypi/requirements.txt

      - name: Patch Chaquopy build-wheel.py
        run: |
          python3 - <<'PY'
          p = "/opt/chaquopy/server/pypi/build-wheel.py"
          src = open(p).read()

          old1 = 'python_executable=f"{self.build_env}/bin/python")'
          new1 = 'python_executable=f"{self.build_env}/bin/python{self.python}")'
          if old1 not in src:
              raise SystemExit("patch1 not found")
          src = src.replace(old1, new1, 1)

          open(p, "w").write(src)
          print("=== patch1 ok ===")
          PY
          grep -n "python_executable=" /opt/chaquopy/server/pypi/build-wheel.py

      - name: Download Android Python target
        run: |
          cd $CHAQUOPY_ROOT
          ./target/download-target.sh \
            maven/com/chaquo/python/target/${{ inputs.python_target_version }}

      - name: Inject sysconfigdata into target zip
        run: |
          bash $GITHUB_WORKSPACE/scripts/inject-sysconfig.sh \
            "3.12" "${{ inputs.python_target_version }}"

      - name: Build ftea
        run: |
          set -euo pipefail
          PYPI_DIR="$CHAQUOPY_ROOT/server/pypi"
          RECIPE_DIR="$PYPI_DIR/packages/astrbot-ftea"
          LOG="/tmp/build-ftea.log"

          rm -rf "$RECIPE_DIR"
          mkdir -p "$RECIPE_DIR"

          cat > "$RECIPE_DIR/meta.yaml" <<EOF
          package:
            name: ftea
            version: "${{ inputs.ftea_version }}"
          source:
            git_url: https://github.com/synodriver/ftea
            git_rev: ${{ inputs.ftea_commit }}
          build:
            number: 0
          requirements:
            build:
              - setuptools 69.1.1
              - wheel 0.42.0
              - cython 3.1.0
              - packaging 23.1
            host:
              - python
          EOF

          echo "=== meta.yaml ==="
          cat "$RECIPE_DIR/meta.yaml"

          cd "$PYPI_DIR"
          if ! python build-wheel.py \
                --python 3.12 \
                --abi arm64-v8a \
                "$RECIPE_DIR" > "$LOG" 2>&1; then
            echo "❌ ftea 构建失败，最后 120 行："
            tail -120 "$LOG"
            exit 1
          fi

          echo "=== 产物 ==="
          find "$PYPI_DIR/dist" -name "*ftea*android_*.whl" -ls

      - name: Collect wheel
        if: success()
        run: |
          mkdir -p /tmp/all-wheels
          find "$CHAQUOPY_ROOT/server/pypi/dist" -name "*ftea*android_*.whl" \
            -exec cp -f {} /tmp/all-wheels/ \;
          ls -la /tmp/all-wheels/

      - name: Upload wheel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ftea-wheels-${{ github.run_number }}
          path: /tmp/all-wheels/*.whl
          retention-days: 90

      - name: Upload to GitHub Release (latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Builds"
          body: "Auto-built Android arm64 wheels."
          files: /tmp/all-wheels/*.whl
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
