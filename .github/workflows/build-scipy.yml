name: Build SciPy for Android arm64

on:
  workflow_dispatch:
    inputs:
      scipy_version:
        description: 'SciPy version'
        required: true
        default: '1.18.1'
      python_target_version:
        description: 'Chaquopy Python target version'
        required: true
        default: '3.12.12-0'

permissions:
  contents: write

concurrency:
  group: build-scipy-${{ github.ref }}
  cancel-in-progress: false

env:
  CHAQUOPY_VERSION: "17.0.0"
  CHAQUOPY_ROOT: /opt/chaquopy
  NDK_VERSION: "27.3.13750724"
  ANDROID_API_LEVEL: "24"
  TARGET: aarch64-linux-android
  PREFIX: /opt/scipy-build
  # 自建 gfortran 工具链的下载地址
  GFORTRAN_URL: "https://github.com/Ruixu-Account/chaquopy-android-wheels/releases/download/toolchain-gfortran/gfortran-arm64.tar.gz"
  # Chaquopy 预编译依赖的下载地址
  LIBGFORTRAN_URL: "https://chaquo.com/pypi-13.1/chaquopy-libgfortran/chaquopy_libgfortran-4.9-0-py3-none-android_21_arm64_v8a.whl"
  OPENBLAS_URL: "https://chaquo.com/pypi-13.1/chaquopy-openblas/chaquopy_openblas-0.2.20-5-py3-none-android_21_arm64_v8a.whl"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk usage (baseline)
        run: df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential wget unzip patchelf jq zip ninja-build file

      - name: Set Android env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Pre-install NDK r27c
        continue-on-error: true
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK_VERSION}" || true

      # ============================================================
      # 下载并解压自建 gfortran 工具链
      # ============================================================
      - name: Download and extract gfortran toolchain
        run: |
          set -euo pipefail
          mkdir -p /opt/android-gfortran
          wget -q --tries=3 --timeout=300 "${GFORTRAN_URL}" -O /tmp/gfortran.tar.gz
          tar -xzf /tmp/gfortran.tar.gz -C /opt/android-gfortran --strip-components=1
          echo "/opt/android-gfortran/bin" >> $GITHUB_PATH
          /opt/android-gfortran/bin/aarch64-linux-android-gfortran --version | head -1

      # ============================================================
      # 下载 Chaquopy 预编译依赖
      # ============================================================
      - name: Download Chaquopy prebuilt dependencies
        run: |
          set -euo pipefail
          mkdir -p /opt/chaquopy-deps/{libgfortran,openblas}
          wget -q "${LIBGFORTRAN_URL}" -O /tmp/libgfortran.whl
          wget -q "${OPENBLAS_URL}" -O /tmp/openblas.whl
          unzip -q /tmp/libgfortran.whl -d /opt/chaquopy-deps/libgfortran
          unzip -q /tmp/openblas.whl -d /opt/chaquopy-deps/openblas
          echo "--- libgfortran 内容 ---"
          find /opt/chaquopy-deps/libgfortran -name "*.so*" -exec ls -la {} \;
          echo "--- openblas 内容 ---"
          find /opt/chaquopy-deps/openblas -name "*.so*" -exec ls -la {} \;

      - name: Clone Chaquopy ${{ env.CHAQUOPY_VERSION }}
        run: |
          git clone --depth 1 --branch $CHAQUOPY_VERSION --recurse-submodules \
            https://github.com/chaquo/chaquopy.git $CHAQUOPY_ROOT
          cd $CHAQUOPY_ROOT
          git submodule update --init --recursive || true

      - name: Install Chaquopy build requirements
        run: |
          pip install -r $CHAQUOPY_ROOT/server/pypi/requirements.txt

      - name: Apply Chaquopy build-wheel.py patches
        run: python3 $GITHUB_WORKSPACE/scripts/patch-build-wheel.py

      - name: Download Android Python target
        run: |
          cd $CHAQUOPY_ROOT
          ./target/download-target.sh \
            maven/com/chaquo/python/target/${{ inputs.python_target_version }}

      - name: Inject sysconfigdata into target zip
        run: |
          bash $GITHUB_WORKSPACE/scripts/inject-sysconfig.sh \
            "3.12" "${{ inputs.python_target_version }}"

      # ============================================================
      # 生成 Meson 交叉编译文件
      # ============================================================
      - name: Generate Meson cross file
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          CROSS_FILE=/tmp/android-arm64.ini

          cat > "$CROSS_FILE" <<EOF
          [binaries]
          c = '${NDK_BIN}/aarch64-linux-android${ANDROID_API_LEVEL}-clang'
          cpp = '${NDK_BIN}/aarch64-linux-android${ANDROID_API_LEVEL}-clang++'
          fortran = '/opt/android-gfortran/bin/aarch64-linux-android-gfortran'
          ar = '${NDK_BIN}/llvm-ar'
          strip = '${NDK_BIN}/llvm-strip'
          ld = '${NDK_BIN}/ld.lld'
          ranlib = '${NDK_BIN}/llvm-ranlib'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          longdouble_format = 'IEEE_QUAD_LE'

          [built-in options]
          c_args = ['-D__BIONIC_NO_PAGE_SIZE_MACRO']
          cpp_args = ['-D__BIONIC_NO_PAGE_SIZE_MACRO']
          EOF

          echo "=== cross-file 内容 ==="
          cat "$CROSS_FILE"

      # ============================================================
      # 构建 SciPy
      # ============================================================
      - name: Build SciPy
        run: |
          set -euo pipefail
          PYPI_DIR="/opt/chaquopy/server/pypi"
          RECIPE_DIR="$PYPI_DIR/packages/astrbot-scipy"
          LOG="/tmp/build-scipy.log"

          rm -rf "$RECIPE_DIR"
          mkdir -p "$RECIPE_DIR"

          # 创建最小化 meta.yaml
          cat > "$RECIPE_DIR/meta.yaml" <<'EOF'
          package:
            name: scipy
            version: "${{ inputs.scipy_version }}"
          source:
            url: https://files.pythonhosted.org/packages/source/s/scipy/scipy-${{ inputs.scipy_version }}.tar.gz
          build:
            number: 0
            script_env:
              - SCIPY_USE_PYTHRAN=0
          requirements:
            build:
              - ninja
              - meson-python
              - cython
              - pkgconfig
            host:
              - python
              - numpy 2.5.3
              - chaquopy-libgfortran 4.9
              - chaquopy-openblas 0.2.20
          EOF

          echo "=== meta.yaml ==="
          cat "$RECIPE_DIR/meta.yaml"

          cd "$PYPI_DIR"
          if ! python build-wheel.py \
                --python 3.12 \
                --abi arm64-v8a \
                "$RECIPE_DIR" > "$LOG" 2>&1; then
            echo "❌ SciPy 构建失败，最后 120 行："
            tail -120 "$LOG"
            exit 1
          fi

          echo "=== 构建产物 ==="
          find "$PYPI_DIR/dist" -name "*scipy*android_*.whl" -ls

      # ============================================================
      # 检查 Soname 兼容性
      # ============================================================
      - name: Check Soname compatibility
        if: success()
        run: |
          set -euo pipefail
          PYPI_DIR="/opt/chaquopy/server/pypi"
          WHEEL=$(find "$PYPI_DIR/dist" -name "*scipy*android_*.whl" | head -1)
          echo "Wheel: $WHEEL"
          mkdir -p /tmp/scipy-check
          unzip -q "$WHEEL" -d /tmp/scipy-check

          echo "=== 检查 .so 文件的 DT_NEEDED ==="
          find /tmp/scipy-check -name "*.so" -exec sh -c '
            for so; do
              echo "--- $so ---"
              readelf -d "$so" | grep -E "NEEDED|SONAME" || true
            done
          ' _ {} \;

          echo ""
          echo "=== 检查 libgfortran 的 SONAME ==="
          find /opt/chaquopy-deps/libgfortran -name "libgfortran.so*" -exec sh -c '
            for so; do
              echo "--- $so ---"
              readelf -d "$so" | grep -E "SONAME" || true
            done
          ' _ {} \;

          echo ""
          echo "=== 如果发现 DT_NEEDED 是 libgfortran.so.3，需要创建符号链接 ==="

      - name: Fix Soname if needed
        if: success()
        run: |
          set -euo pipefail
          PYPI_DIR="/opt/chaquopy/server/pypi"
          WHEEL=$(find "$PYPI_DIR/dist" -name "*scipy*android_*.whl" | head -1)
          WORK_DIR=/tmp/scipy-fix
          mkdir -p "$WORK_DIR"
          unzip -q "$WHEEL" -d "$WORK_DIR"

          # 检查是否有 .so 依赖 libgfortran.so.3
          NEEDS_3=$(find "$WORK_DIR" -name "*.so" -exec sh -c '
            readelf -d "$1" 2>/dev/null | grep -c "libgfortran.so.3" || true
          ' _ {} \; | awk '{s+=$1} END{print s+0}')

          if [ "$NEEDS_3" -gt 0 ]; then
            echo "⚠️ 发现 $NEEDS_3 个 .so 文件依赖 libgfortran.so.3，创建符号链接..."
            # 在 wheel 的 lib 目录下创建符号链接
            find "$WORK_DIR" -type d -name "lib" -exec sh -c '
              for libdir; do
                if [ -f "$libdir/libgfortran.so.5" ]; then
                  ln -sf libgfortran.so.5 "$libdir/libgfortran.so.3"
                  echo "已创建: $libdir/libgfortran.so.3 -> libgfortran.so.5"
                fi
              done
            ' _ {} \;
            # 重新打包 wheel
            cd "$WORK_DIR"
            zip -qr "$WHEEL" .
            echo "✅ Wheel 已重新打包"
          else
            echo "✅ 没有 .so 文件依赖 libgfortran.so.3，无需处理"
          fi

      - name: Collect wheel
        if: success()
        run: |
          mkdir -p /tmp/all-wheels
          find /opt/chaquopy/server/pypi/dist -name "*scipy*android_*.whl" \
            -exec cp -f {} /tmp/all-wheels/ \;
          ls -la /tmp/all-wheels/

      - name: Upload wheel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scipy-wheels-${{ github.run_number }}
          path: /tmp/all-wheels/*.whl
          retention-days: 90

      - name: Upload to GitHub Release (latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Builds"
          body: "Auto-built Android arm64 wheels."
          files: /tmp/all-wheels/*.whl
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
