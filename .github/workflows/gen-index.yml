name: Generate PyPI Index

on:
  workflow_dispatch: # 仅保留手动触发按钮

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Latest Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --json assets > release_assets.json

      - name: Generate PEP 503 HTML
        run: |
          mkdir -p worker/public/simple
          
          python - <<EOF
          import json, os
          
          with open('release_assets.json', 'r') as f:
              data = json.load(f)

          packages = {}
          for asset in data.get('assets', []):
              name = asset['name']
              if name.endswith('.whl'):
                  pkg_name = name.split('-')[0].lower().replace('_', '-')
                  if pkg_name not in packages:
                      packages[pkg_name] = []
                  packages[pkg_name].append(f'<a href="/{name}">{name}</a><br/>')

          for pkg, links in packages.items():
              pkg_dir = f'worker/public/simple/{pkg}'
              os.makedirs(pkg_dir, exist_ok=True)
              with open(f'{pkg_dir}/index.html', 'w') as f:
                  f.write(f'<!DOCTYPE html><html><body>\n' + '\n'.join(links) + '\n</body></html>')

          with open('worker/public/simple/index.html', 'w') as f:
              f.write('<!DOCTYPE html><html><body>\n')
              for pkg in sorted(packages.keys()):
                  f.write(f'<a href="/simple/{pkg}/">{pkg}</a><br/>\n')
              f.write('</body></html>')
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add worker/public/
          git commit -m "chore: auto-generate PyPI index" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
