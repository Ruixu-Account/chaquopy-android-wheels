name: Auto Generate PyPI Index

on:
  release:
    types: [published] # 每次发布 Release 时触发
  workflow_dispatch:   # 允许你在 Actions 页面手动点按钮触发

permissions:
  contents: write      # 必须给写权限，因为要把生成的 HTML push 回仓库

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Latest Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取最新 Release 的 Assets 列表并保存为 JSON
          gh release view --json assets > release_assets.json

      - name: Generate PEP 503 HTML
        run: |
          # 创建目标目录
          mkdir -p worker/public/simple
          
          python - <<EOF
          import json, os
          
          with open('release_assets.json', 'r') as f:
              data = json.load(f)

          packages = {}
          for asset in data.get('assets', []):
              name = asset['name']
              if name.endswith('.whl'):
                  pkg_name = name.split('-')[0].lower().replace('_', '-')
                  if pkg_name not in packages:
                      packages[pkg_name] = []
                  # 相对路径，对应 Worker 代理的根目录
                  packages[pkg_name].append(f'<a href="/{name}">{name}</a><br/>')

          # 1. 生成单个包的页面
          for pkg, links in packages.items():
              pkg_dir = f'worker/public/simple/{pkg}'
              os.makedirs(pkg_dir, exist_ok=True)
              with open(f'{pkg_dir}/index.html', 'w') as f:
                  f.write(f'<!DOCTYPE html><html><body>\n' + '\n'.join(links) + '\n</body></html>')

          # 2. 生成根目录索引
          with open('worker/public/simple/index.html', 'w') as f:
              f.write('<!DOCTYPE html><html><body>\n')
              for pkg in sorted(packages.keys()):
                  f.write(f'<a href="/simple/{pkg}/">{pkg}</a><br/>\n')
              f.write('</body></html>')
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add worker/public/
          # 如果没有变化就不提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generate PyPI index [skip ci]" && git push)
