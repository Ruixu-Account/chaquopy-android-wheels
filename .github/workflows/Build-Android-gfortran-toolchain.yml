name: Build Android gfortran toolchain

on:
  workflow_dispatch:
    inputs:
      gcc_version:
        description: 'GCC 版本'
        required: true
        default: '13.2.0'
      ndk_version:
        description: 'NDK 版本'
        required: true
        default: '27.3.13750724'

permissions:
  contents: write

concurrency:
  group: build-gfortran-toolchain
  cancel-in-progress: false

env:
  GCC_VERSION: ${{ inputs.gcc_version }}
  NDK_VERSION: ${{ inputs.ndk_version }}
  API_LEVEL: '24'
  TARGET: aarch64-linux-android
  PREFIX: /opt/gcc-android-gfortran
  SRC_DIR: /tmp/gcc-src
  BUILD_DIR: /tmp/gcc-build
  PREDEF_HEADER: /tmp/gcc-android-predef.h

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk usage (baseline)
        run: df -h / /tmp 2>/dev/null || df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            wget xz-utils file

      - name: Set Android env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Pre-install NDK r27c
        continue-on-error: true
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK_VERSION}" || true

      - name: Verify NDK layout
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$NDK_BIN/aarch64-linux-android${API_LEVEL}-clang" ] || {
            echo "::error::找不到 NDK clang"
            ls "$NDK_BIN" | head -30
            exit 1
          }
          "$NDK_BIN/aarch64-linux-android${API_LEVEL}-clang" --version | head -2

      # ============================================================
      # 修复 NDK 头文件布局（asm/bits 符号链接）
      # ============================================================
      - name: Fix NDK header layout for GCC
        run: |
          set -euo pipefail
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          ARCH_DIR="aarch64-linux-android"

          for sub in asm bits; do
            if [ -d "$NDK_SYSROOT/usr/include/$ARCH_DIR/$sub" ] && [ ! -e "$NDK_SYSROOT/usr/include/$sub" ]; then
              ln -s "$ARCH_DIR/$sub" "$NDK_SYSROOT/usr/include/$sub"
              echo "✅ ln -s $ARCH_DIR/$sub"
            fi
          done

          ls -la "$NDK_SYSROOT/usr/include/" | grep -E "asm|bits" || true
          ls -la "$NDK_SYSROOT/usr/include/asm/types.h" 2>/dev/null && echo "✅ asm/types.h OK" || echo "⚠️ asm/types.h 缺失"

      # ============================================================
      # ★ 新增：预定义头文件，替代含括号的 -D 宏
      #   用 -include 注入，命令行里无特殊字符，shell 不会报错
      # ============================================================
      - name: Create GCC predef header
        run: |
          cat > "$PREDEF_HEADER" <<'EOF'
          #ifndef __ANDROID_API__
          #define __ANDROID_API__ 24
          #endif

          /* Silence NDK's clang-only availability attributes for GCC.
           * These macros are #ifndef-guarded in NDK cdefs.h, so our
           * definitions win over the originals. */
          #ifndef __INTRODUCED_IN
          #define __INTRODUCED_IN(api_level)
          #endif
          #ifndef __DEPRECATED_IN
          #define __DEPRECATED_IN(api_level)
          #endif
          #ifndef __REMOVED_IN
          #define __REMOVED_IN(api_level)
          #endif
          #ifndef __ANDROID_UNAVAILABLE_SYMBOLS_ARE_WEAK__
          #define __ANDROID_UNAVAILABLE_SYMBOLS_ARE_WEAK__ 1
          #endif
          EOF

          echo "--- $PREDEF_HEADER ---"
          cat "$PREDEF_HEADER"

      - name: Cache GCC source
        uses: actions/cache@v4
        with:
          path: ${{ env.SRC_DIR }}
          key: gcc-src-${{ env.GCC_VERSION }}-v2

      - name: Download GCC source
        run: |
          set -euo pipefail
          mkdir -p "$SRC_DIR"
          if [ -d "$SRC_DIR/gcc-${GCC_VERSION}" ] && [ -f "$SRC_DIR/gcc-${GCC_VERSION}/configure" ]; then
            echo "✅ GCC 源码已缓存"
            exit 0
          fi
          cd "$SRC_DIR"
          URL="https://mirrors.tuna.tsinghua.edu.cn/gnu/gcc/gcc-${GCC_VERSION}/gcc-${GCC_VERSION}.tar.xz"
          wget -q --tries=3 --timeout=300 "$URL" -O gcc.tar.xz
          tar -xf gcc.tar.xz
          rm -f gcc.tar.xz
          df -h /

      - name: Create tool wrappers
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          WRAP=/tmp/gcc-tools
          mkdir -p "$WRAP"
          CLANG_TARGET="aarch64-linux-android${API_LEVEL}"

          cat > "$WRAP/as" <<EOF
          #!/bin/bash
          out=""; input=""
          while [ \$# -gt 0 ]; do
            case "\$1" in
              -o) out="\$2"; shift 2 ;;
              -o*) out="\${1#-o}"; shift ;;
              *.s|*.S) input="\$1"; shift ;;
              *) shift ;;
            esac
          done
          [ -z "\$input" ] && { echo "as-wrapper: no input" >&2; exit 1; }
          [ -z "\$out" ]   && { echo "as-wrapper: no -o" >&2; exit 1; }
          if grep -q '\.section.*\.eh_frame,"aw"' "\$input" 2>/dev/null; then
            sed -i -E 's/(\.section[[:space:]]+\.eh_frame),"aw"/\1,"a"/g' "\$input"
          fi
          if grep -q '\.section.*\.gcc_except_table,"aw"' "\$input" 2>/dev/null; then
            sed -i -E 's/(\.section[[:space:]]+\.gcc_except_table),"aw"/\1,"a"/g' "\$input"
          fi
          exec "${NDK_BIN}/clang" --target=${CLANG_TARGET} -c -o "\$out" "\$input"
          EOF
          chmod +x "$WRAP/as"

          cat > "$WRAP/ld" <<EOF
          #!/bin/bash
          exec "${NDK_BIN}/clang" --target=${CLANG_TARGET} "\$@"
          EOF
          chmod +x "$WRAP/ld"

          cat > "$WRAP/gcc" <<EOF
          #!/bin/bash
          exec "${NDK_BIN}/clang" --target=${CLANG_TARGET} "\$@"
          EOF
          chmod +x "$WRAP/gcc"

          ln -sf "${NDK_BIN}/llvm-ar"      "$WRAP/ar"
          ln -sf "${NDK_BIN}/llvm-ranlib"  "$WRAP/ranlib"
          ln -sf "${NDK_BIN}/llvm-nm"      "$WRAP/nm"
          ln -sf "${NDK_BIN}/llvm-strip"   "$WRAP/strip"
          ln -sf "${NDK_BIN}/llvm-objcopy" "$WRAP/objcopy"

          ls -la "$WRAP"

      - name: Configure GCC
        run: |
          set -euo pipefail
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          WRAP=/tmp/gcc-tools

          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          rm -rf "${BUILD_DIR:?}"/*

          "$SRC_DIR/gcc-${GCC_VERSION}/configure" \
            --target="$TARGET" \
            --prefix="$PREFIX" \
            --enable-languages=fortran \
            --disable-bootstrap \
            --disable-multilib \
            --disable-shared \
            --disable-threads \
            --disable-libssp \
            --disable-libquadmath \
            --disable-libgomp \
            --disable-libatomic \
            --disable-libsanitizer \
            --disable-libstdcxx \
            --disable-nls \
            --disable-werror \
            --with-sysroot="$NDK_SYSROOT" \
            --with-build-sysroot="$NDK_SYSROOT" \
            --with-as="$WRAP/as" \
            --with-ld="$WRAP/ld" \
            --with-ar="$WRAP/ar" \
            --with-ranlib="$WRAP/ranlib" \
            --with-nm="$WRAP/nm" \
            --with-strip="$WRAP/strip" \
            --with-arch=armv8-a \
            --with-abi=lp64 \
            --enable-clocale=gnu \
            --enable-lto \
            2>&1 | tee /tmp/gcc-configure.log

          [ -f Makefile ] || {
            echo "::error::configure 未生成 Makefile"
            tail -80 /tmp/gcc-configure.log
            exit 1
          }
          echo "✅ configure 完成"
          df -h /

      - name: Build all-gcc (Fortran frontend)
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make -j"$(nproc)" all-gcc 2>&1 | tee /tmp/gcc-build-gcc.log
          df -h /

      # ============================================================
      # ★ 关键：CFLAGS_FOR_TARGET 只含 -include，无括号
      # ============================================================
      - name: Build target-libgcc
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make -j"$(nproc)" all-target-libgcc \
            CFLAGS_FOR_TARGET="-g -O2 -include $PREDEF_HEADER" \
            2>&1 | tee /tmp/gcc-build-libgcc.log
          df -h /

      - name: Dump libgcc config.log on failure
        if: failure()
        run: |
          LOG="$BUILD_DIR/aarch64-linux-android/libgcc/config.log"
          [ -f "$LOG" ] && { echo "=== config.log 尾部 200 行 ==="; tail -200 "$LOG"; }
          echo ""
          echo "=== 手动测试：含系统头文件的 C 编译 ==="
          XGCC="$BUILD_DIR/gcc/xgcc"
          if [ -x "$XGCC" ]; then
            cat > /tmp/t2.c <<'EOF'
          #include <stdio.h>
          #include <sys/types.h>
          int main(void){return 0;}
          EOF
            echo "--- xgcc -c t2.c ---"
            "$XGCC" -B"$BUILD_DIR/gcc/" -include "$PREDEF_HEADER" \
              -c /tmp/t2.c -o /tmp/t2.o -v 2>&1 | tail -60 || true
            ls -la /tmp/t2.o 2>/dev/null || echo "(no .o)"
          fi
          echo ""
          echo "=== wrappers（只显示文本）==="
          for f in /tmp/gcc-tools/*; do
            echo "--- $f ---"
            if file "$f" | grep -q text; then cat "$f"; else echo "(binary, skipped)"; fi
          done

      - name: Build target-libgfortran
        if: success()
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make -j"$(nproc)" all-target-libgfortran \
            CFLAGS_FOR_TARGET="-g -O2 -include $PREDEF_HEADER" \
            2>&1 | tee /tmp/gcc-build-libgfortran.log
          df -h /

      - name: Install GCC
        if: success()
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make install-gcc install-target-libgcc install-target-libgfortran \
            2>&1 | tee /tmp/gcc-install.log
          ls -la "$PREFIX/bin/"
          du -sh "$PREFIX"

      - name: Verify gfortran
        if: success()
        run: |
          set -euo pipefail
          GFC="$PREFIX/bin/${TARGET}-gfortran"
          [ -x "$GFC" ] || { echo "::error::gfortran 未找到"; exit 1; }
          "$GFC" --version | head -3

          cat > /tmp/hello.f90 <<'EOF'
          program hello
            integer :: i
            real :: s
            s = 0.0
            do i = 1, 10
              s = s + real(i)
            end do
            print *, "sum:", s
          end program hello
          EOF

          "$GFC" -c /tmp/hello.f90 -o /tmp/hello.o
          readelf -h /tmp/hello.o | grep -E "Machine|Class|Data"
          readelf -h /tmp/hello.o | grep -qi "aarch64\|AArch64" \
            || { echo "::error::输出架构不是 aarch64"; exit 1; }
          echo "✅ 输出架构是 aarch64"

      - name: Cleanup before pack
        if: success()
        run: |
          rm -rf "$SRC_DIR" "$BUILD_DIR"
          rm -rf "$ANDROID_NDK_HOME" || true
          df -h /
          du -sh "$PREFIX"

      - name: Pack toolchain
        if: success()
        run: |
          cd "$PREFIX"
          tar -czf /tmp/gfortran-android-arm64.tar.gz .
          ls -la /tmp/gfortran-android-arm64.tar.gz

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gfortran-android-arm64-gcc${{ env.GCC_VERSION }}
          path: /tmp/gfortran-android-arm64.tar.gz
          retention-days: 90

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolchain-gfortran
          name: "gfortran for Android arm64"
          body: |
            Cross gfortran toolchain for Android `aarch64-linux-android`, API ${{ env.API_LEVEL }}.
            Built from GCC ${{ env.GCC_VERSION }} + NDK r27c (${{ env.NDK_VERSION }}).
          files: /tmp/gfortran-android-arm64.tar.gz
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: success()
        run: |
          echo "## ✅ gfortran toolchain built" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/download/toolchain-gfortran/gfortran-android-arm64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
