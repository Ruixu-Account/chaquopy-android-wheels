name: Build Android gfortran toolchain

on:
  workflow_dispatch:
    inputs:
      gcc_version:
        description: 'GCC 版本'
        required: true
        default: '13.2.0'
      ndk_version:
        description: 'NDK 版本'
        required: true
        default: '27.3.13750724'

permissions:
  contents: write

concurrency:
  group: build-gfortran-toolchain
  cancel-in-progress: false

env:
  GCC_VERSION: ${{ inputs.gcc_version }}
  NDK_VERSION: ${{ inputs.ndk_version }}
  API_LEVEL: '24'
  TARGET: aarch64-linux-android
  PREFIX: /opt/gcc-android-gfortran
  SRC_DIR: /tmp/gcc-src
  BUILD_DIR: /tmp/gcc-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk usage (baseline)
        run: df -h / /tmp 2>/dev/null || df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            wget xz-utils file

      - name: Set Android env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Pre-install NDK r27c
        continue-on-error: true
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK_VERSION}" || true

      - name: Verify NDK layout
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$NDK_BIN/aarch64-linux-android${API_LEVEL}-clang" ] || {
            echo "::error::找不到 NDK clang: $NDK_BIN/aarch64-linux-android${API_LEVEL}-clang"
            ls "$NDK_BIN" | head -30
            exit 1
          }
          echo "✅ NDK clang 存在"
          "$NDK_BIN/aarch64-linux-android${API_LEVEL}-clang" --version | head -2

      - name: Cache GCC source
        uses: actions/cache@v4
        with:
          path: ${{ env.SRC_DIR }}
          key: gcc-src-${{ env.GCC_VERSION }}-v2

      - name: Download GCC source
        run: |
          set -euo pipefail
          mkdir -p "$SRC_DIR"
          if [ -d "$SRC_DIR/gcc-${GCC_VERSION}" ] && [ -f "$SRC_DIR/gcc-${GCC_VERSION}/configure" ]; then
            echo "✅ GCC 源码已缓存，跳过下载"
            exit 0
          fi
          cd "$SRC_DIR"
          URL="https://mirrors.tuna.tsinghua.edu.cn/gnu/gcc/gcc-${GCC_VERSION}/gcc-${GCC_VERSION}.tar.xz"
          echo "下载 $URL"
          wget -q --tries=3 --timeout=300 "$URL" -O gcc.tar.xz
          tar -xf gcc.tar.xz
          rm -f gcc.tar.xz
          ls -d "$SRC_DIR/gcc-${GCC_VERSION}"
          df -h /

      # ============================================================
      # ★ 工具 wrappers
      #   - clang 必须显式 --target，否则猜错架构
      #   - 修 GCC 13 vs clang 18 的 .eh_frame / .gcc_except_table
      #     section flags 冲突："aw" → "a"
      # ============================================================
      - name: Create tool wrappers
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          WRAP=/tmp/gcc-tools
          mkdir -p "$WRAP"
          CLANG_TARGET="aarch64-linux-android${API_LEVEL}"

          cat > "$WRAP/as" <<EOF
          #!/bin/bash
          out=""; input=""
          while [ \$# -gt 0 ]; do
            case "\$1" in
              -o) out="\$2"; shift 2 ;;
              -o*) out="\${1#-o}"; shift ;;
              *.s|*.S) input="\$1"; shift ;;
              *) shift ;;
            esac
          done
          [ -z "\$input" ] && { echo "as-wrapper: no input" >&2; exit 1; }
          [ -z "\$out" ]   && { echo "as-wrapper: no -o" >&2; exit 1; }

          # ★ 修 GCC 13 vs clang 18 section flags 冲突
          if grep -q '\.section.*\.eh_frame,"aw"' "\$input" 2>/dev/null; then
            sed -i -E 's/(\.section[[:space:]]+\.eh_frame),"aw"/\1,"a"/g' "\$input"
          fi
          if grep -q '\.section.*\.gcc_except_table,"aw"' "\$input" 2>/dev/null; then
            sed -i -E 's/(\.section[[:space:]]+\.gcc_except_table),"aw"/\1,"a"/g' "\$input"
          fi

          exec "${NDK_BIN}/clang" --target=${CLANG_TARGET} -c -o "\$out" "\$input"
          EOF
          chmod +x "$WRAP/as"

          cat > "$WRAP/ld" <<EOF
          #!/bin/bash
          exec "${NDK_BIN}/clang" --target=${CLANG_TARGET} "\$@"
          EOF
          chmod +x "$WRAP/ld"

          cat > "$WRAP/gcc" <<EOF
          #!/bin/bash
          exec "${NDK_BIN}/clang" --target=${CLANG_TARGET} "\$@"
          EOF
          chmod +x "$WRAP/gcc"

          ln -sf "${NDK_BIN}/llvm-ar"      "$WRAP/ar"
          ln -sf "${NDK_BIN}/llvm-ranlib"  "$WRAP/ranlib"
          ln -sf "${NDK_BIN}/llvm-nm"      "$WRAP/nm"
          ln -sf "${NDK_BIN}/llvm-strip"   "$WRAP/strip"
          ln -sf "${NDK_BIN}/llvm-objcopy" "$WRAP/objcopy"

          echo "--- wrappers ---"
          ls -la "$WRAP"
          echo "--- as ---"
          cat "$WRAP/as"
          echo "--- ld ---"
          cat "$WRAP/ld"

      - name: Configure GCC
        run: |
          set -euo pipefail
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          WRAP=/tmp/gcc-tools

          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          rm -rf "${BUILD_DIR:?}"/*

          "$SRC_DIR/gcc-${GCC_VERSION}/configure" \
            --target="$TARGET" \
            --prefix="$PREFIX" \
            --enable-languages=fortran \
            --disable-bootstrap \
            --disable-multilib \
            --disable-shared \
            --disable-threads \
            --disable-libssp \
            --disable-libquadmath \
            --disable-libgomp \
            --disable-libatomic \
            --disable-libsanitizer \
            --disable-libstdcxx \
            --disable-nls \
            --disable-werror \
            --with-sysroot="$NDK_SYSROOT" \
            --with-build-sysroot="$NDK_SYSROOT" \
            --with-as="$WRAP/as" \
            --with-ld="$WRAP/ld" \
            --with-ar="$WRAP/ar" \
            --with-ranlib="$WRAP/ranlib" \
            --with-nm="$WRAP/nm" \
            --with-strip="$WRAP/strip" \
            --with-arch=armv8-a \
            --with-abi=lp64 \
            --enable-clocale=gnu \
            --enable-lto \
            2>&1 | tee /tmp/gcc-configure.log

          [ -f Makefile ] || {
            echo "::error::configure 未生成 Makefile，最后 80 行："
            tail -80 /tmp/gcc-configure.log
            exit 1
          }
          echo "✅ configure 完成"
          df -h /

      - name: Build all-gcc (Fortran frontend)
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make -j"$(nproc)" all-gcc 2>&1 | tee /tmp/gcc-build-gcc.log
          df -h /
          du -sh "$BUILD_DIR" "$SRC_DIR" 2>/dev/null || true

      - name: Build target-libgcc
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make -j"$(nproc)" all-target-libgcc 2>&1 | tee /tmp/gcc-build-libgcc.log
          df -h /
          du -sh "$BUILD_DIR" 2>/dev/null || true

      - name: Dump libgcc config.log on failure
        if: failure()
        run: |
          LOG="$BUILD_DIR/aarch64-linux-android/libgcc/config.log"
          if [ -f "$LOG" ]; then
            echo "=== libgcc/config.log 尾部 200 行 ==="
            tail -200 "$LOG"
          else
            echo "(config.log 不存在)"
          fi
          echo ""
          echo "=== 手动复现 xgcc 编译 ==="
          XGCC="$BUILD_DIR/gcc/xgcc"
          if [ -x "$XGCC" ]; then
            echo 'int main(void){return 0;}' > /tmp/t.c
            echo "--- xgcc -c ---"
            "$XGCC" -B"$BUILD_DIR/gcc/" -c /tmp/t.c -o /tmp/t.o -v 2>&1 | tail -80 || true
            ls -la /tmp/t.o 2>/dev/null || echo "(no .o produced)"
            echo ""
            echo "--- xgcc 链接 ---"
            "$XGCC" -B"$BUILD_DIR/gcc/" /tmp/t.c -o /tmp/t -v 2>&1 | tail -80 || true
            ls -la /tmp/t 2>/dev/null || echo "(no executable produced)"
          else
            echo "(xgcc 不存在: $XGCC)"
          fi
          echo ""
          echo "=== wrappers 内容 ==="
          for f in /tmp/gcc-tools/*; do
            echo "--- $f ---"
            cat "$f" 2>/dev/null || echo "(binary)"
          done

      - name: Build target-libgfortran
        if: success()
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make -j"$(nproc)" all-target-libgfortran 2>&1 | tee /tmp/gcc-build-libgfortran.log
          df -h /
          du -sh "$BUILD_DIR" 2>/dev/null || true

      - name: Install GCC
        if: success()
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make install-gcc install-target-libgcc install-target-libgfortran \
            2>&1 | tee /tmp/gcc-install.log
          echo "=== 安装后目录 ==="
          ls -la "$PREFIX/bin/"
          echo "--- prefix 大小 ---"
          du -sh "$PREFIX"
          df -h /

      - name: Verify gfortran
        if: success()
        run: |
          set -euo pipefail
          GFC="$PREFIX/bin/${TARGET}-gfortran"
          [ -x "$GFC" ] || { echo "::error::gfortran 未找到: $GFC"; exit 1; }

          echo "=== gfortran 版本 ==="
          "$GFC" --version | head -3

          echo "=== 交叉编译测试 ==="
          cat > /tmp/hello.f90 <<'EOF'
          program hello
            integer :: i
            real :: s
            s = 0.0
            do i = 1, 10
              s = s + real(i)
            end do
            print *, "sum:", s
          end program hello
          EOF

          "$GFC" -c /tmp/hello.f90 -o /tmp/hello.o
          file /tmp/hello.o
          echo "--- readelf 架构检查 ---"
          readelf -h /tmp/hello.o | grep -E "Machine|Class|Data"

          if readelf -h /tmp/hello.o | grep -qi "aarch64\|AArch64"; then
            echo "✅ 输出架构是 aarch64"
          else
            echo "::error::输出架构不是 aarch64"
            readelf -h /tmp/hello.o
            exit 1
          fi

          echo "=== libgfortran / libgcc 检查 ==="
          find "$PREFIX" -name "libgfortran*" -o -name "libgcc*" | head -20

      - name: Cleanup before pack
        if: success()
        run: |
          df -h /
          rm -rf "$SRC_DIR" "$BUILD_DIR"
          rm -rf "$ANDROID_NDK_HOME" || true
          echo "--- 清理后 ---"
          df -h /
          du -sh "$PREFIX" 2>/dev/null || true

      - name: Pack toolchain
        if: success()
        run: |
          set -euo pipefail
          cd "$PREFIX"
          tar -czf /tmp/gfortran-android-arm64.tar.gz .
          ls -la /tmp/gfortran-android-arm64.tar.gz
          du -h /tmp/gfortran-android-arm64.tar.gz

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gfortran-android-arm64-gcc${{ env.GCC_VERSION }}
          path: /tmp/gfortran-android-arm64.tar.gz
          retention-days: 90

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolchain-gfortran
          name: "gfortran for Android arm64"
          body: |
            Cross gfortran toolchain for Android `aarch64-linux-android`, API ${{ env.API_LEVEL }}.
            Built from GCC ${{ env.GCC_VERSION }} + NDK r27c (${{ env.NDK_VERSION }}).
          files: /tmp/gfortran-android-arm64.tar.gz
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: success()
        run: |
          echo "## ✅ gfortran toolchain built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**下载 URL**：" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/download/toolchain-gfortran/gfortran-android-arm64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "在 SciPy workflow 的 \`gfortran_url\` 输入里填这个 URL。" >> $GITHUB_STEP_SUMMARY
