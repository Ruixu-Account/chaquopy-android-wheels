name: Build Android gfortran toolchain

on:
  workflow_dispatch:
    inputs:
      gcc_version:
        description: 'GCC 版本'
        required: true
        default: '13.2.0'
      ndk_version:
        description: 'NDK 版本'
        required: true
        default: '27.3.13750724'

permissions:
  contents: write

concurrency:
  group: build-gfortran-toolchain
  cancel-in-progress: false

env:
  GCC_VERSION: ${{ inputs.gcc_version }}
  NDK_VERSION: ${{ inputs.ndk_version }}
  API_LEVEL: '24'
  TARGET: aarch64-linux-android
  PREFIX: /opt/gcc-android-gfortran
  SRC_DIR: /tmp/gcc-src
  BUILD_DIR: /tmp/gcc-build
  PREDEF_HEADER: /tmp/gcc-android-predef.h

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk usage (baseline)
        run: df -h / /tmp 2>/dev/null || df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            wget xz-utils file

      - name: Set Android env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Pre-install NDK r27c
        continue-on-error: true
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK_VERSION}" || true

      - name: Verify NDK layout
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$NDK_BIN/aarch64-linux-android${API_LEVEL}-clang" ] || {
            echo "::error::找不到 NDK clang"
            exit 1
          }
          "$NDK_BIN/aarch64-linux-android${API_LEVEL}-clang" --version | head -2

      - name: Fix NDK header layout and add glibc-style crt stubs
        run: |
          set -euo pipefail
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ARCH_DIR="aarch64-linux-android"
          CRT_DIR="$NDK_SYSROOT/usr/lib/${ARCH_DIR}/${API_LEVEL}"
          CLANG="$NDK_BIN/${ARCH_DIR}${API_LEVEL}-clang"

          for sub in asm bits; do
            if [ -d "$NDK_SYSROOT/usr/include/$ARCH_DIR/$sub" ] && [ ! -e "$NDK_SYSROOT/usr/include/$sub" ]; then
              ln -s "$ARCH_DIR/$sub" "$NDK_SYSROOT/usr/include/$sub"
            fi
          done

          [ -d "$CRT_DIR" ] || { echo "::error::$CRT_DIR 不存在"; exit 1; }

          cat > /tmp/crt1_stub.c <<'EOF'
          void _start(void) { }
          EOF
          "$CLANG" -c /tmp/crt1_stub.c -o "$CRT_DIR/crt1.o"

          echo 'void _dummy_crti(void) { }' > /tmp/crti_stub.c
          "$CLANG" -c /tmp/crti_stub.c -o "$CRT_DIR/crti.o"

          echo 'void _dummy_crtn(void) { }' > /tmp/crtn_stub.c
          "$CLANG" -c /tmp/crtn_stub.c -o "$CRT_DIR/crtn.o"

          ls -la "$CRT_DIR"/crt1.o "$CRT_DIR"/crti.o "$CRT_DIR"/crtn.o

      - name: Strip NDK availability annotations for GCC
        run: |
          set -euo pipefail
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          INCLUDE_DIR="$NDK_SYSROOT/usr/include"

          find "$INCLUDE_DIR" -type f \( -name '*.h' -o -name '*.hpp' \) -print0 | \
            xargs -0 -n 100 sed -i -E \
              -e '/^[[:space:]]*#/!s/__INTRODUCED_IN[A-Z_]*\([^)]*\)/ /g' \
              -e '/^[[:space:]]*#/!s/__DEPRECATED_IN[A-Z_]*\([^)]*\)/ /g' \
              -e '/^[[:space:]]*#/!s/__REMOVED_IN[A-Z_]*\([^)]*\)/ /g'

          IOCTL_H="$INCLUDE_DIR/bits/ioctl.h"
          if [ -f "$IOCTL_H" ]; then
            sed -i -E '/__overloadable/d' "$IOCTL_H"
          fi

      - name: Create GCC predef header
        run: |
          cat > "$PREDEF_HEADER" <<'EOF'
          #ifndef __ANDROID_API__
          #define __ANDROID_API__ 24
          #endif

          #ifndef __INTRODUCED_IN
          #define __INTRODUCED_IN(api_level)
          #endif
          #ifndef __DEPRECATED_IN
          #define __DEPRECATED_IN(api_level)
          #endif
          #ifndef __REMOVED_IN
          #define __REMOVED_IN(api_level)
          #endif
          #ifndef __INTRODUCED_IN_NO_GUARD_FOR_NDK
          #define __INTRODUCED_IN_NO_GUARD_FOR_NDK(api_level)
          #endif
          #ifndef __DEPRECATED_IN_NO_GUARD_FOR_NDK
          #define __DEPRECATED_IN_NO_GUARD_FOR_NDK(api_level)
          #endif
          #ifndef __REMOVED_IN_NO_GUARD_FOR_NDK
          #define __REMOVED_IN_NO_GUARD_FOR_NDK(api_level)
          #endif
          #ifndef __ANDROID_UNAVAILABLE_SYMBOLS_ARE_WEAK__
          #define __ANDROID_UNAVAILABLE_SYMBOLS_ARE_WEAK__ 1
          #endif

          #ifndef _Nonnull
          #define _Nonnull
          #endif
          #ifndef _Nullable
          #define _Nullable
          #endif
          #ifndef _Null_unspecified
          #define _Null_unspecified
          #endif

          #ifndef __printflike
          #define __printflike(fmtarg, firstvararg)
          #endif
          #ifndef __scanflike
          #define __scanflike(fmtarg, firstvararg)
          #endif
          #ifndef __format_arg
          #define __format_arg(fmtarg)
          #endif
          #ifndef __wur
          #define __wur
          #endif
          #ifndef __errordecl
          #define __errordecl(name, msg)
          #endif

          #ifndef __overloadable
          #define __overloadable
          #endif
          #ifndef __enable_if
          #define __enable_if(...)
          #endif
          #ifndef __RENAME
          #define __RENAME(name)
          #endif

          #ifndef __attribute_const__
          #define __attribute_const__ __attribute__((const))
          #endif
          #ifndef __attribute_pure__
          #define __attribute_pure__ __attribute__((pure))
          #endif

          #ifndef __predict_true
          #define __predict_true(exp)  __builtin_expect((exp) != 0, 1)
          #endif
          #ifndef __predict_false
          #define __predict_false(exp) __builtin_expect((exp) != 0, 0)
          #endif
          EOF

      - name: Cache GCC source
        uses: actions/cache@v4
        with:
          path: ${{ env.SRC_DIR }}
          key: gcc-src-${{ env.GCC_VERSION }}-v2

      - name: Download GCC source
        run: |
          set -euo pipefail
          mkdir -p "$SRC_DIR"
          if [ -d "$SRC_DIR/gcc-${GCC_VERSION}" ] && [ -f "$SRC_DIR/gcc-${GCC_VERSION}/configure" ]; then
            echo "✅ 已缓存"
            exit 0
          fi
          cd "$SRC_DIR"
          URL="https://mirrors.tuna.tsinghua.edu.cn/gnu/gcc/gcc-${GCC_VERSION}/gcc-${GCC_VERSION}.tar.xz"
          wget -q --tries=3 --timeout=300 "$URL" -O gcc.tar.xz
          tar -xf gcc.tar.xz
          rm -f gcc.tar.xz

      - name: Create tool wrappers
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          WRAP=/tmp/gcc-tools
          TARGET_BIN="$WRAP/target-bin"
          mkdir -p "$WRAP" "$TARGET_BIN"
          CLANG_TARGET="aarch64-linux-android${API_LEVEL}"

          cat > "$WRAP/as" <<EOF
          #!/bin/bash
          out=""; input=""
          while [ \$# -gt 0 ]; do
            case "\$1" in
              -o) out="\$2"; shift 2 ;;
              -o*) out="\${1#-o}"; shift ;;
              *.s|*.S) input="\$1"; shift ;;
              *) shift ;;
            esac
          done
          [ -z "\$input" ] && { echo "as-wrapper: no input" >&2; exit 1; }
          [ -z "\$out" ]   && { echo "as-wrapper: no -o" >&2; exit 1; }
          if grep -q '\.section.*\.eh_frame,"aw"' "\$input" 2>/dev/null; then
            sed -i -E 's/(\.section[[:space:]]+\.eh_frame),"aw"/\1,"a"/g' "\$input"
          fi
          if grep -q '\.section.*\.gcc_except_table,"aw"' "\$input" 2>/dev/null; then
            sed -i -E 's/(\.section[[:space:]]+\.gcc_except_table),"aw"/\1,"a"/g' "\$input"
          fi
          exec "${NDK_BIN}/clang" --target=${CLANG_TARGET} -c -o "\$out" "\$input"
          EOF
          chmod +x "$WRAP/as"

          cat > "$WRAP/ld" <<EOF
          #!/bin/bash
          ARGS=()
          while [ \$# -gt 0 ]; do
            case "\$1" in
              -maarch64linux|-EL|-EB|-X)
                shift ;;
              -V|--version)
                ARGS+=("-Wl,--version")
                shift ;;
              --build-id=*|--build-id)
                shift ;;
              --no-rosegment|--rosegment)
                shift ;;
              -z)
                shift 2 ;;
              -z*)
                shift ;;
              -dynamic-linker)
                shift 2 ;;
              -dynamic-linker=*)
                shift ;;
              *crt1.o|*crti.o|*crtn.o|*crtbegin.o|*crtbeginS.o|*crtbeginT.o|*crtend.o|*crtendS.o)
                shift ;;
              *Scrt1.o|*rcrt1.o|*gcrt1.o|*grcrt1.o|*crtfastmath.o)
                shift ;;
              -lgcc_s)
                shift ;;
              -lpthread|-lrt|-ldl)
                shift ;;
              *)
                ARGS+=("\$1")
                shift ;;
            esac
          done
          exec "${NDK_BIN}/clang" --target=${CLANG_TARGET} "\${ARGS[@]}"
          EOF
          chmod +x "$WRAP/ld"

          ln -sf "${NDK_BIN}/llvm-ar"      "$WRAP/ar"
          ln -sf "${NDK_BIN}/llvm-ranlib"  "$WRAP/ranlib"
          ln -sf "${NDK_BIN}/llvm-nm"      "$WRAP/nm"
          ln -sf "${NDK_BIN}/llvm-strip"   "$WRAP/strip"
          ln -sf "${NDK_BIN}/llvm-objcopy" "$WRAP/objcopy"

          ln -sf "${NDK_BIN}/llvm-ar"      "$TARGET_BIN/${TARGET}-ar"
          ln -sf "${NDK_BIN}/llvm-ranlib"  "$TARGET_BIN/${TARGET}-ranlib"
          ln -sf "${NDK_BIN}/llvm-nm"      "$TARGET_BIN/${TARGET}-nm"
          ln -sf "${NDK_BIN}/llvm-strip"   "$TARGET_BIN/${TARGET}-strip"
          ln -sf "${NDK_BIN}/llvm-objcopy" "$TARGET_BIN/${TARGET}-objcopy"

          echo "$TARGET_BIN" >> $GITHUB_PATH

      - name: Configure GCC
        run: |
          set -euo pipefail
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          WRAP=/tmp/gcc-tools

          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          rm -rf "${BUILD_DIR:?}"/*

          "$SRC_DIR/gcc-${GCC_VERSION}/configure" \
            --target="$TARGET" \
            --prefix="$PREFIX" \
            --enable-languages=fortran \
            --disable-bootstrap \
            --disable-multilib \
            --disable-shared \
            --disable-threads \
            --disable-libssp \
            --disable-libquadmath \
            --disable-libgomp \
            --disable-libatomic \
            --disable-libsanitizer \
            --disable-libstdcxx \
            --disable-libvtv \
            --disable-libphobos \
            --disable-libitm \
            --disable-liboffloadmic \
            --disable-nls \
            --disable-werror \
            --with-sysroot="$NDK_SYSROOT" \
            --with-build-sysroot="$NDK_SYSROOT" \
            --with-as="$WRAP/as" \
            --with-ld="$WRAP/ld" \
            --with-ar="$WRAP/ar" \
            --with-ranlib="$WRAP/ranlib" \
            --with-nm="$WRAP/nm" \
            --with-strip="$WRAP/strip" \
            --with-arch=armv8-a \
            --with-abi=lp64 \
            --enable-clocale=gnu \
            --enable-lto \
            2>&1 | tee /tmp/gcc-configure.log

          [ -f Makefile ] || {
            echo "::error::configure 未生成 Makefile"
            tail -80 /tmp/gcc-configure.log
            exit 1
          }
          echo "✅ configure 完成"

      - name: Build all-gcc (Fortran frontend)
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          find "$BUILD_DIR" -type f -name 'Makefile' -print0 | \
            xargs -0 --no-run-if-empty sed -i -E \
              's/-Werror([=[:space:]]|$)/-Wno-error\1/g'

          make -j"$(nproc)" all-gcc 2>&1 | tee /tmp/gcc-build-gcc.log

      - name: Build target-libgcc
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          find "$BUILD_DIR" -type f -name 'Makefile' -print0 | \
            xargs -0 --no-run-if-empty sed -i -E \
              's/-Werror([=[:space:]]|$)/-Wno-error\1/g'

          make -j"$(nproc)" all-target-libgcc \
            CFLAGS_FOR_TARGET="-g -O2 -fPIC -Wno-error=implicit-function-declaration -Wno-error=vla -include $PREDEF_HEADER" \
            2>&1 | tee /tmp/gcc-build-libgcc.log

      # ============================================================
      # libgfortran：-fPIC + -Wno-error=... 都要给
      # ============================================================
      - name: Build target-libgfortran
        if: success()
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          # 二次保险：Makefile 如果已经生成，直接 sed
          LF_MAKEFILE="$BUILD_DIR/aarch64-linux-android/libgfortran/Makefile"
          if [ -f "$LF_MAKEFILE" ]; then
            sed -i 's/-Werror=implicit-function-declaration/-Wno-error=implicit-function-declaration/g' "$LF_MAKEFILE"
            sed -i 's/-Werror=vla/-Wno-error=vla/g' "$LF_MAKEFILE"
          fi

          # 关键：CFLAGS_FOR_TARGET 里同时带 -fPIC 和 -Wno-error
          # 后者会覆盖 Makefile 里硬编码的 -Werror=
          make -j"$(nproc)" all-target-libgfortran \
            CFLAGS_FOR_TARGET="-g -O2 -fPIC -Wno-error=implicit-function-declaration -Wno-error=vla -include $PREDEF_HEADER" \
            2>&1 | tee /tmp/gcc-build-libgfortran.log

      - name: Install GCC
        if: success()
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make install-gcc install-target-libgcc install-target-libgfortran \
            2>&1 | tee /tmp/gcc-install.log
          ls -la "$PREFIX/bin/"

      - name: Verify gfortran
        if: success()
        run: |
          set -euo pipefail
          GFC="$PREFIX/bin/${TARGET}-gfortran"
          [ -x "$GFC" ] || { echo "::error::gfortran 未找到"; exit 1; }
          "$GFC" --version | head -3

          cat > /tmp/hello.f90 <<'EOF'
          program hello
            print *, "hello from gfortran"
          end program hello
          EOF

          "$GFC" -c /tmp/hello.f90 -o /tmp/hello.o
          readelf -h /tmp/hello.o | grep -E "Machine|Class|Data"
          readelf -h /tmp/hello.o | grep -qi "aarch64\|AArch64" \
            || { echo "::error::输出架构不是 aarch64"; exit 1; }
          echo "✅ 输出架构是 aarch64"

      - name: Cleanup before pack
        if: success()
        run: |
          rm -rf "$SRC_DIR" "$BUILD_DIR"
          rm -rf "$ANDROID_NDK_HOME" || true
          du -sh "$PREFIX"

      - name: Pack toolchain
        if: success()
        run: |
          cd "$PREFIX"
          tar -czf /tmp/gfortran-arm64.tar.gz .
          ls -la /tmp/gfortran-arm64.tar.gz

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gfortran-android-arm64-gcc${{ env.GCC_VERSION }}
          path: /tmp/gfortran-arm64.tar.gz
          retention-days: 90

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolchain-gfortran
          name: "gfortran for Android arm64"
          body: |
            Cross gfortran toolchain for Android `aarch64-linux-android`, API ${{ env.API_LEVEL }}.
            Built from GCC ${{ env.GCC_VERSION }} + NDK r27c (${{ env.NDK_VERSION }}).
          files: /tmp/gfortran-arm64.tar.gz
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
