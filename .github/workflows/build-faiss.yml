name: Build faiss-cpu for Android

on:
  workflow_dispatch:
    inputs:
      faiss_version:
        description: 'faiss 版本（如 1.15.1）'
        required: true
        default: '1.15.1'
      python:
        description: 'Python 版本'
        required: true
        default: '3.12'
        type: choice
        options:
          - '3.12'
      python_target_version:
        description: 'Chaquopy Python target 版本'
        required: true
        default: '3.12.12-0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.11

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip patchelf jq zip ninja-build swig

      - name: Clone Chaquopy 17.0.0
        run: |
          git clone --depth 1 --branch 17.0.0 --recurse-submodules \
            https://github.com/chaquo/chaquopy.git /opt/chaquopy
          cd /opt/chaquopy
          git submodule update --init --recursive || true

      - name: Install Chaquopy build requirements
        run: |
          pip install -r /opt/chaquopy/server/pypi/requirements.txt

      - name: Set Android env vars
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Pre-install NDK r27c
        continue-on-error: true
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724" || true

      - name: Patch Chaquopy build-wheel.py
        run: |
          python3 - <<'PY'
          p = "/opt/chaquopy/server/pypi/build-wheel.py"
          src = open(p).read()

          old1 = 'python_executable=f"{self.build_env}/bin/python")'
          new1 = 'python_executable=f"{self.build_env}/bin/python{self.python}")'
          if old1 not in src:
              raise SystemExit("patch1 not found")
          src = src.replace(old1, new1, 1)

          old2 = ('            "PYO3_CROSS_PYTHON_VERSION": self.python,\n'
                  '        })')
          new2 = ('            "PYO3_CROSS_PYTHON_VERSION": self.python,\n'
                  '            "PYO3_CROSS_LIB_DIR": f"{self.host_env}/chaquopy/lib",\n'
                  '        })')
          if old2 not in src:
              raise SystemExit("patch2 not found")
          src = src.replace(old2, new2, 1)

          old3 = '            return self.builder.build("wheel", "dist")'
          new3 = ('            py_include = f"{self.host_env}/chaquopy/include/python{self.python}"\n'
                  '            py_lib = f"{self.host_env}/chaquopy/lib/libpython{self.python}.so"\n'
                  '            return self.builder.build(\n'
                  '                "wheel", "dist",\n'
                  '                config_settings={\n'
                  '                    "cmake.define.FAISS_ENABLE_GPU": "OFF",\n'
                  '                    "cmake.define.FAISS_ENABLE_PYTHON": "ON",\n'
                  '                    "cmake.define.FAISS_OPT_LEVEL": "generic",\n'
                  '                    "cmake.define.BUILD_TESTING": "OFF",\n'
                  '                    "cmake.define.BLA_VENDOR": "OpenBLAS",\n'
                  '                    "cmake.define.Python_EXECUTABLE": "/opt/hostedtoolcache/Python/3.12.14/x64/bin/python3.12",\n'
                  '                    "cmake.define.Python_INCLUDE_DIR": py_include,\n'
                  '                    "cmake.define.Python_LIBRARY": py_lib,\n'
                  '                }\n'
                  '            )')
          if old3 not in src:
              raise SystemExit("patch3 not found")
          src = src.replace(old3, new3, 1)

          open(p, "w").write(src)
          print("=== 3 patches ok ===")
          PY
          grep -n "python_executable=" /opt/chaquopy/server/pypi/build-wheel.py
          grep -n "PYO3_CROSS_LIB_DIR" /opt/chaquopy/server/pypi/build-wheel.py
          grep -n "cmake.define.FAISS_ENABLE_GPU" /opt/chaquopy/server/pypi/build-wheel.py

      - name: Download Android Python target
        run: |
          cd /opt/chaquopy
          ./target/download-target.sh \
            maven/com/chaquo/python/target/${{ inputs.python_target_version }}
          find /opt/chaquopy/maven -name "*.zip" -exec ls -la {} \;

      - name: Inject sysconfigdata
        run: |
          ZIP="/opt/chaquopy/maven/com/chaquo/python/target/${{ inputs.python_target_version }}/target-${{ inputs.python_target_version }}-arm64-v8a.zip"
          PY_VER="${{ inputs.python }}"
          PY_VER_NODOT="${PY_VER//./}"
          INJ=/tmp/inject_sysconfig
          rm -rf "$INJ"
          mkdir -p "$INJ/jniLibs/arm64-v8a"
          cat > "$INJ/jniLibs/arm64-v8a/_sysconfigdata__linux_aarch64-linux-android.py" <<EOF
          build_time_vars = {
              "SOABI": "cpython-${PY_VER_NODOT}-aarch64-linux-android",
              "EXT_SUFFIX": ".cpython-${PY_VER_NODOT}-aarch64-linux-android.so",
              "VERSION": "${PY_VER}",
              "LDVERSION": "${PY_VER}",
              "py_version_nodot": "${PY_VER_NODOT}",
              "py_version_short": "${PY_VER}",
              "Py_ENABLE_SHARED": 1,
              "Py_DEBUG": 0,
              "Py_REF_DEBUG": 0,
              "abiflags": "",
              "prefix": "/data/data/com.astrbot.app/files/astrbot_root",
              "exec_prefix": "/data/data/com.astrbot.app/files/astrbot_root",
              "CC": "aarch64-linux-android24-clang",
              "CXX": "aarch64-linux-android24-clang++",
              "LDSHARED": "aarch64-linux-android24-clang -shared",
          }
          EOF
          cd "$INJ"
          zip "$ZIP" jniLibs/arm64-v8a/_sysconfigdata__linux_aarch64-linux-android.py
          unzip -l "$ZIP" | grep sysconfigdata

      - name: Download dependencies
        run: |
          DIST_DIR="/opt/chaquopy/server/pypi/dist"

          mkdir -p "$DIST_DIR/numpy"
          wget -q "https://github.com/Ruixu-Account/chaquopy-android-wheels/releases/download/latest/numpy-2.5.3-0-cp312-cp312-android_24_arm64_v8a.whl" \
            -O "$DIST_DIR/numpy/numpy-2.5.3-0-cp312-cp312-android_24_arm64_v8a.whl"

          mkdir -p "$DIST_DIR/chaquopy-openblas"
          wget -q "https://chaquo.com/pypi-13.1/chaquopy-openblas/chaquopy_openblas-0.2.20-5-py3-none-android_21_arm64_v8a.whl" \
            -O "$DIST_DIR/chaquopy-openblas/chaquopy_openblas-0.2.20-5-py3-none-android_21_arm64_v8a.whl"

          mkdir -p "$DIST_DIR/chaquopy-libcxx"
          wget -q "https://chaquo.com/pypi-13.1/chaquopy-libcxx/chaquopy_libcxx-180000-0-py3-none-android_24_arm64_v8a.whl" \
            -O "$DIST_DIR/chaquopy-libcxx/chaquopy_libcxx-180000-0-py3-none-android_24_arm64_v8a.whl"

          echo "=== dist 目录 ==="
          find "$DIST_DIR" -name "*.whl" -exec ls -la {} \;

      - name: Clone and patch faiss source
        run: |
          cd /tmp
          rm -rf faiss-src
          git clone --depth 1 --branch v${{ inputs.faiss_version }} \
            --recurse-submodules https://github.com/facebookresearch/faiss faiss-src
          cd faiss-src

          # 打 license patch
          echo "=== original license line ==="
          grep -n "^license" pyproject.toml || echo "(none)"

          python3 - <<'PY'
          import re
          path = "pyproject.toml"
          with open(path) as f:
              content = f.read()
          new_content = re.sub(
              r'^license = "([^"]+)"',
              r'license = {text = "\1"}',
              content,
              flags=re.MULTILINE
          )
          if new_content == content:
              print("WARN: no license line changed")
          else:
              print("OK: license line patched")
          with open(path, "w") as f:
              f.write(new_content)
          PY
          grep -n "^license" pyproject.toml

          # 打 CMakeLists.txt patch
          echo "=== BEFORE: find_package(Python) ==="
          grep -n "find_package(Python\|Python_NumPy" faiss/python/CMakeLists.txt || echo "(not found)"

          python3 - <<'PY'
          import re
          path = "faiss/python/CMakeLists.txt"
          with open(path) as f:
              content = f.read()

          # 匹配整个 find_package(...) 语句（可能跨行）
          # 有 3 个连续 find_package(Python...) 都是问题点
          pattern = re.compile(
              r'find_package\s*\(\s*Python\b[^)]*\)',
              re.MULTILINE | re.DOTALL
          )
          matches = pattern.findall(content)
          print(f"FOUND {len(matches)} find_package(Python) statements")
          for m in matches:
              print(f"  {m!r}")

          if not matches:
              raise SystemExit("FATAL: no find_package(Python) found")

          replacement = (
              'find_package(Python REQUIRED COMPONENTS Development.Module)\n'
              'file(GLOB _py_inc_dirs "${Python_INCLUDE_DIRS}")\n'
              '# 从 Python_INCLUDE_DIR 推算 <host_env>/chaquopy/, 再推出 numpy 路径\n'
              'get_filename_component(_py_base "${Python_INCLUDE_DIRS}" DIRECTORY)\n'
              'get_filename_component(_host_env "${_py_base}" DIRECTORY)\n'
              'set(Python_NumPy_INCLUDE_DIRS "${_host_env}/numpy/_core/include")\n'
              'message(STATUS "Chaquopy: Python_INCLUDE_DIRS = ${Python_INCLUDE_DIRS}")\n'
              'message(STATUS "Chaquopy: Python_NumPy_INCLUDE_DIRS = ${Python_NumPy_INCLUDE_DIRS}")'
          )

          for m in matches:
              content = content.replace(m, replacement, 1)

          with open(path, "w") as f:
              f.write(content)
          print("OK: patched all find_package(Python) statements")
          PY

          echo "=== AFTER: find_package(Python) ==="
          grep -n "find_package(Python\|Python_NumPy_INCLUDE_DIRS" faiss/python/CMakeLists.txt || echo "(not found)"
          
      - name: Prepare faiss recipe
        run: |
          RECIPE="/opt/chaquopy/server/pypi/packages/astrbot-faiss-cpu"
          rm -rf "$RECIPE"
          mkdir -p "$RECIPE"

          cat > "$RECIPE/meta.yaml" <<'EOF'
          package:
            name: faiss-cpu
            version: "${{ inputs.faiss_version }}"
          source:
            path: /tmp/faiss-src
          build:
            number: 0
          requirements:
            build:
              - cmake 3.24.0
              - ninja 1.11.1
              - scikit-build-core 0.10.7
              - numpy 2.5.3
            host:
              - python
              - numpy 2.5.3
              - chaquopy-openblas 0.2.20
              - chaquopy-libcxx 180000
          EOF

          echo "=== meta.yaml ==="
          cat "$RECIPE/meta.yaml"

      - name: Build faiss
        run: |
          cd /opt/chaquopy/server/pypi
          python build-wheel.py \
            --python ${{ inputs.python }} \
            --abi arm64-v8a \
            /opt/chaquopy/server/pypi/packages/astrbot-faiss-cpu 2>&1 | tee /tmp/build-faiss.log
          echo "=== last 80 lines ==="
          tail -80 /tmp/build-faiss.log

      - name: List built wheels
        if: always()
        run: |
          find /opt/chaquopy/server/pypi/dist/faiss-cpu -name "*.whl" -exec ls -la {} \; || true

      - name: Collect android wheel
        if: success()
        run: |
          mkdir -p /tmp/all-wheels
          find /opt/chaquopy/server/pypi/dist/faiss-cpu -name "*android_*.whl" \
            -exec cp -f {} /tmp/all-wheels/ \;
          ls -la /tmp/all-wheels/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: faiss-cpu-${{ inputs.faiss_version }}-android
          path: /tmp/all-wheels/*.whl
          if-no-files-found: error
          retention-days: 90

      - name: Upload to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: /tmp/all-wheels/*.whl
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
