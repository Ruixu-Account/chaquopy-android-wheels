name: Build Android Wheel

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '批量模式：逗号/空格/换行分隔的 package==version（留空则用单包模式）'
        required: false
        default: ''
      package:
        description: '单包模式：包名'
        required: false
        default: ''
      version:
        description: '单包模式：版本'
        required: false
        default: ''
      python:
        description: 'Python 版本'
        required: true
        default: '3.12'
        type: choice
        options:
          - '3.12'
          - '3.13'
      python_target_version:
        description: 'Chaquopy Python target 版本'
        required: true
        default: '3.12.12-0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: /opt/chaquopy/server/pypi/packages
          key: astrbot-android-wheels

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip patchelf jq zip

      - name: Clone Chaquopy 17.0.0
        run: |
          git clone --depth 1 --branch 17.0.0 --recurse-submodules \
            https://github.com/chaquo/chaquopy.git /opt/chaquopy
          cd /opt/chaquopy
          git submodule update --init --recursive || true
          echo "=== packages 数量 ==="
          ls /opt/chaquopy/server/pypi/packages/ | wc -l

      - name: Install Chaquopy build requirements
        run: |
          pip install -r /opt/chaquopy/server/pypi/requirements.txt

      - name: Set Android env vars
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Pre-install NDK r27c
        continue-on-error: true
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724" || true

      - name: Patch Chaquopy build-wheel.py
        run: |
          python3 - <<'PY'
          import re
          p = "/opt/chaquopy/server/pypi/build-wheel.py"
          src = open(p).read()

          # Patch 1: maturin 从文件名解析 Python 版本
          old1 = 'python_executable=f"{self.build_env}/bin/python")'
          new1 = 'python_executable=f"{self.build_env}/bin/python{self.python}")'
          if old1 not in src:
              raise SystemExit("patch1 target not found")
          src = src.replace(old1, new1, 1)

          # Patch 2: 告诉 maturin/pyo3 Android 的 libpython 在哪
          old2 = ('            "PYO3_CROSS_PYTHON_VERSION": self.python,\n'
                  '        })')
          new2 = ('            "PYO3_CROSS_PYTHON_VERSION": self.python,\n'
                  '            "PYO3_CROSS_LIB_DIR": f"{self.host_env}/chaquopy/lib",\n'
                  '        })')
          if old2 not in src:
              raise SystemExit("patch2 target not found")
          src = src.replace(old2, new2, 1)

          # Patch 3: abi3 包需要 libpython3.so 软链接（正则匹配，不依赖缩进）
          pat = re.compile(
              r'(for name in \["pthread", "rt"\]:\s*\n\s*run\(f"[^"]*lib\{name\}\.a"\))'
          )
          m = pat.search(src)
          if not m:
              raise SystemExit("patch3 anchor not found")
          insertion = (
              '\n        if self.needs_python:\n'
              '            lib_dir = f"{self.host_env}/chaquopy/lib"\n'
              '            py_lib = f"{lib_dir}/libpython{self.python}.so"\n'
              '            generic_lib = f"{lib_dir}/libpython3.so"\n'
              '            if exists(py_lib) and not exists(generic_lib):\n'
              '                run(f"ln -s libpython{self.python}.so {generic_lib}")'
          )
          src = src[:m.end()] + insertion + src[m.end():]

          open(p, "w").write(src)
          print("=== 3 patches ok ===")
          PY
          echo "=== verify patch1 ==="
          grep -n "python_executable=" /opt/chaquopy/server/pypi/build-wheel.py
          echo "=== verify patch2 ==="
          grep -n "PYO3_CROSS_LIB_DIR" /opt/chaquopy/server/pypi/build-wheel.py
          echo "=== verify patch3 ==="
          grep -n "generic_lib" /opt/chaquopy/server/pypi/build-wheel.py
          
      - name: Download Android Python target
        run: |
          cd /opt/chaquopy
          ./target/download-target.sh \
            maven/com/chaquo/python/target/${{ inputs.python_target_version }}
          find /opt/chaquopy/maven -name "*.zip" -exec ls -la {} \;

      - name: Inject sysconfigdata into target zip
        run: |
          ZIP="/opt/chaquopy/maven/com/chaquo/python/target/${{ inputs.python_target_version }}/target-${{ inputs.python_target_version }}-arm64-v8a.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: target zip not found: $ZIP"
            exit 1
          fi

          PY_VER="${{ inputs.python }}"
          PY_VER_NODOT="${PY_VER//./}"

          INJ=/tmp/inject_sysconfig
          rm -rf "$INJ"
          mkdir -p "$INJ/jniLibs/arm64-v8a"

          cat > "$INJ/jniLibs/arm64-v8a/_sysconfigdata__linux_aarch64-linux-android.py" <<EOF
          build_time_vars = {
              "SOABI": "cpython-${PY_VER_NODOT}-aarch64-linux-android",
              "EXT_SUFFIX": ".cpython-${PY_VER_NODOT}-aarch64-linux-android.so",
              "VERSION": "${PY_VER}",
              "LDVERSION": "${PY_VER}",
              "py_version_nodot": "${PY_VER_NODOT}",
              "py_version_short": "${PY_VER}",
              "Py_ENABLE_SHARED": 1,
              "Py_DEBUG": 0,
              "Py_REF_DEBUG": 0,
              "abiflags": "",
              "prefix": "/data/data/com.astrbot.app/files/astrbot_root",
              "exec_prefix": "/data/data/com.astrbot.app/files/astrbot_root",
              "CC": "aarch64-linux-android24-clang",
              "CXX": "aarch64-linux-android24-clang++",
              "LDSHARED": "aarch64-linux-android24-clang -shared",
          }
          EOF

          cd "$INJ"
          zip "$ZIP" jniLibs/arm64-v8a/_sysconfigdata__linux_aarch64-linux-android.py
          unzip -l "$ZIP" | grep sysconfigdata

      - name: Download Chaquopy prebuilt deps
        run: bash $GITHUB_WORKSPACE/scripts/download-deps.sh

      - name: Build packages
        env:
          CARGO_BUILD_JOBS: "2"
          PYTHON_VER: ${{ inputs.python }}
          PACKAGES_INPUT: ${{ inputs.packages }}
          SINGLE_PACKAGE: ${{ inputs.package }}
          SINGLE_VERSION: ${{ inputs.version }}
        run: bash $GITHUB_WORKSPACE/scripts/build-packages.sh

      - name: Upload wheel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ github.run_number }}
          path: /tmp/all-wheels/*.whl
          if-no-files-found: error
          retention-days: 90

      - name: Upload to GitHub Release (latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Builds"
          body: "Auto-built Android arm64 wheels."
          files: /tmp/all-wheels/*.whl
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
