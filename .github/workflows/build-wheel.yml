name: Build Android Wheel

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'PyPI package name (e.g. jiter)'
        required: true
        default: 'jiter'
      version:
        description: 'Package version (e.g. 0.8.0)'
        required: true
        default: '0.8.0'
      python:
        description: 'Python major.minor version'
        required: true
        default: '3.12'
        type: choice
        options:
          - '3.12'
          - '3.13'
      python_target_version:
        description: 'Chaquopy Python target version'
        required: true
        default: '3.12.12-0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip patchelf jq zip

      - name: Clone Chaquopy 17.0.0
        run: |
          git clone --depth 1 --branch 17.0.0 \
            https://github.com/chaquo/chaquopy.git /opt/chaquopy
          echo "=== /opt/chaquopy/target ==="
          ls -la /opt/chaquopy/target
          echo "=== /opt/chaquopy/server/pypi ==="
          ls -la /opt/chaquopy/server/pypi

      - name: Install Chaquopy build requirements
        run: |
          pip install -r /opt/chaquopy/server/pypi/requirements.txt

      - name: Set Android env vars
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Pre-install NDK r27c
        continue-on-error: true
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724" || true
          ls -la $ANDROID_HOME/ndk/ || true

      - name: Patch Chaquopy build-wheel.py
        run: |
          python3 - <<'PY'
          p = "/opt/chaquopy/server/pypi/build-wheel.py"
          src = open(p).read()

          old1 = 'python_executable=f"{self.build_env}/bin/python")'
          new1 = 'python_executable=f"{self.build_env}/bin/python{self.python}")'
          if old1 not in src:
              raise SystemExit("patch1 target not found")
          src = src.replace(old1, new1, 1)

          old2 = ('            "PYO3_CROSS_PYTHON_VERSION": self.python,\n'
                  '        })')
          new2 = ('            "PYO3_CROSS_PYTHON_VERSION": self.python,\n'
                  '            "PYO3_CROSS_LIB_DIR": f"{self.host_env}/chaquopy/lib",\n'
                  '        })')
          if old2 not in src:
              raise SystemExit("patch2 target not found")
          src = src.replace(old2, new2, 1)

          open(p, "w").write(src)
          print("=== both patches ok ===")
          PY
          echo "=== verify patch1 ==="
          grep -n "python_executable=" /opt/chaquopy/server/pypi/build-wheel.py
          echo "=== verify patch2 ==="
          grep -n "PYO3_CROSS_LIB_DIR" /opt/chaquopy/server/pypi/build-wheel.py

      - name: Download Android Python target
        run: |
          cd /opt/chaquopy
          ./target/download-target.sh \
            maven/com/chaquo/python/target/${{ inputs.python_target_version }}
          echo "=== downloaded zips ==="
          find /opt/chaquopy/maven -name "*.zip" -exec ls -la {} \;

      - name: Inject sysconfigdata into target zip
        run: |
          ZIP="/opt/chaquopy/maven/com/chaquo/python/target/${{ inputs.python_target_version }}/target-${{ inputs.python_target_version }}-arm64-v8a.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: target zip not found: $ZIP"
            find /opt/chaquopy/maven -name "*.zip"
            exit 1
          fi
          echo "ZIP=$ZIP"

          PY_VER="${{ inputs.python }}"
          PY_VER_NODOT="${PY_VER//./}"

          INJ=/tmp/inject_sysconfig
          rm -rf "$INJ"
          mkdir -p "$INJ/jniLibs/arm64-v8a"

          cat > "$INJ/jniLibs/arm64-v8a/_sysconfigdata__linux_aarch64-linux-android.py" <<EOF
          build_time_vars = {
              "SOABI": "cpython-${PY_VER_NODOT}-aarch64-linux-android",
              "EXT_SUFFIX": ".cpython-${PY_VER_NODOT}-aarch64-linux-android.so",
              "VERSION": "${PY_VER}",
              "LDVERSION": "${PY_VER}",
              "py_version_nodot": "${PY_VER_NODOT}",
              "py_version_short": "${PY_VER}",
              "Py_ENABLE_SHARED": 1,
              "Py_DEBUG": 0,
              "Py_REF_DEBUG": 0,
              "abiflags": "",
              "prefix": "/data/data/com.astrbot.app/files/astrbot_root",
              "exec_prefix": "/data/data/com.astrbot.app/files/astrbot_root",
              "CC": "aarch64-linux-android24-clang",
              "CXX": "aarch64-linux-android24-clang++",
              "LDSHARED": "aarch64-linux-android24-clang -shared",
          }
          EOF

          cd "$INJ"
          zip "$ZIP" jniLibs/arm64-v8a/_sysconfigdata__linux_aarch64-linux-android.py

          echo "=== verify in zip ==="
          unzip -l "$ZIP" | grep sysconfigdata || { echo "NOT FOUND IN ZIP"; exit 1; }

      - name: Prepare recipe directory
        run: |
          set -e
          PKG="${{ inputs.package }}"
          VER="${{ inputs.version }}"
          RECIPE_DIR=/opt/chaquopy/server/pypi/packages/astrbot-$PKG

          sudo rm -rf "$RECIPE_DIR"
          sudo mkdir -p "$RECIPE_DIR/src"
          sudo chown -R "$USER:$USER" "$RECIPE_DIR"

          SDIST_URL=$(curl -s "https://pypi.org/pypi/$PKG/$VER/json" \
            | jq -r '.urls[] | select(.packagetype=="sdist") | .url' | head -n1)
          if [ -z "$SDIST_URL" ] || [ "$SDIST_URL" = "null" ]; then
            echo "ERROR: No sdist found on PyPI for $PKG==$VER"
            exit 1
          fi
          echo "Downloading sdist: $SDIST_URL"
          wget -q "$SDIST_URL" -O /tmp/sdist.tar.gz
          tar -xzf /tmp/sdist.tar.gz -C /tmp

          if [ ! -d "/tmp/$PKG-$VER" ]; then
            echo "ERROR: expected /tmp/$PKG-$VER not found"
            ls -la /tmp
            exit 1
          fi
          cp -a "/tmp/$PKG-$VER/." "$RECIPE_DIR/src/"

          if [ -f "$RECIPE_DIR/src/Cargo.toml" ]; then
            sed -i 's/^lto = true/lto = false/' "$RECIPE_DIR/src/Cargo.toml" || true
            sed -i 's/^lto = "fat"/lto = false/' "$RECIPE_DIR/src/Cargo.toml" || true
            sed -i 's/^lto = "thin"/lto = false/' "$RECIPE_DIR/src/Cargo.toml" || true
            sed -i 's/^codegen-units = 1/codegen-units = 16/' "$RECIPE_DIR/src/Cargo.toml" || true
            echo "=== patched Cargo.toml release profile ==="
            grep -A 5 '\[profile.release\]' "$RECIPE_DIR/src/Cargo.toml" || true
          fi

          cat > "$RECIPE_DIR/meta.yaml" <<EOF
          package:
            name: $PKG
            version: $VER
          build:
            number: 0
            script_env: []
          source:
            path: src
          requirements:
            build:
              - rust
            host:
              - python
          EOF

          echo "=== recipe dir ==="
          ls -la "$RECIPE_DIR"
          echo "=== meta.yaml ==="
          cat "$RECIPE_DIR/meta.yaml"

      - name: Build wheel
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          cd /opt/chaquopy/server/pypi
          set +e
          python build-wheel.py \
            --python ${{ inputs.python }} \
            --abi arm64-v8a \
            /opt/chaquopy/server/pypi/packages/astrbot-${{ inputs.package }} 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          echo "=== last 60 lines ==="
          tail -60 /tmp/build.log
          exit $RC

      - name: List built wheels
        if: always()
        run: |
          echo "=== dist ==="
          find /opt/chaquopy/server/pypi/dist -name "*.whl" -exec ls -la {} \; || true
          echo "=== recipe build dir ==="
          find /opt/chaquopy/server/pypi/packages/astrbot-${{ inputs.package }} -name "*.whl" -exec ls -la {} \; || true

      - name: Upload wheel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}-${{ inputs.python }}-arm64
          path: /opt/chaquopy/server/pypi/dist/**/*.whl
          retention-days: 90
