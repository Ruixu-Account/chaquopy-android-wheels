name: Build Android Wheel

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '批量模式：逗号/空格/换行分隔的 package==version（留空则用单包模式）'
        required: false
        default: ''
      package:
        description: '单包模式：包名'
        required: false
        default: ''
      version:
        description: '单包模式：版本'
        required: false
        default: ''
      python:
        description: 'Python 版本'
        required: true
        default: '3.12'
        type: choice
        options:
          - '3.12'
          - '3.13'
      python_target_version:
        description: 'Chaquopy Python target 版本'
        required: true
        default: '3.12.12-0'

permissions:
  contents: write

# ★ 新增：并发控制，避免手动触发两次互相覆盖 Release
concurrency:
  group: build-android-wheel-${{ github.ref }}
  cancel-in-progress: false

# ★ 新增：job 级环境变量，避免硬编码散落各处
env:
  CHAQUOPY_VERSION: "17.0.0"
  CHAQUOPY_ROOT: /opt/chaquopy
  NDK_VERSION: "27.3.13750724"
  RUST_TOOLCHAIN: "1.90.0"
  RUST_TARGET: "aarch64-linux-android"
  ANDROID_API_LEVEL: "24"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.11

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip patchelf jq zip

      # ============================================================
      # ★ 顺序调整：先 clone Chaquopy，后装 Rust
      #   理由：rust cache 需要真实的 workspace 路径
      # ============================================================
      - name: Clone Chaquopy ${{ env.CHAQUOPY_VERSION }}
        run: |
          git clone --depth 1 --branch $CHAQUOPY_VERSION --recurse-submodules \
            https://github.com/chaquo/chaquopy.git $CHAQUOPY_ROOT
          cd $CHAQUOPY_ROOT
          git submodule update --init --recursive || true
          echo "=== packages 数量 ==="
          ls $CHAQUOPY_ROOT/server/pypi/packages/ | wc -l

      # ============================================================
      # ★ Rust 环境重构：关键修复
      #   - 显式安装指定 toolchain（1.90.0）
      #   - 给它装 aarch64-linux-android target
      #   - 通过 RUSTUP_TOOLCHAIN 覆盖 sdist 里的 rust-toolchain.toml
      # ============================================================
      - name: Setup Rust toolchain with Android target
        run: |
          # 使用 rustup 官方脚本，安装指定版本 + 最小 profile
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"

          # 让后续所有 step 都能找到 cargo/rustup
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

          # 当前 step 内也需要立即 source
          . "$HOME/.cargo/env"

          # 给这个 toolchain 装 Android target
          rustup target add "$RUST_TARGET"

          # ★ 关键：同时给 rust-toolchain.toml 里可能出现的变体装一遍
          #   防止某些包 pin 的是 "1.90" 而不是 "1.90.0"
          for tc in "$RUST_TOOLCHAIN" "${RUST_TOOLCHAIN%.*}" stable; do
            rustup toolchain install "$tc" --profile minimal \
              --target "$RUST_TARGET" 2>/dev/null || true
          done

          echo "=== rustc ===" && rustc --version
          echo "=== installed targets (default) ==="
          rustup target list --installed

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Set Android env vars
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/$NDK_VERSION" >> $GITHUB_ENV

          # ★ Rust Android linker 配置（NDK r27c，API 24）
          NDK_BIN="/usr/local/lib/android/sdk/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_BIN}/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=${NDK_BIN}/llvm-ar" >> $GITHUB_ENV

          # ★ 强制所有后续 cargo 调用都用我们配置过的 toolchain，
          #   这样 sdist 里的 rust-toolchain.toml 就不会再触发自动安装
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> $GITHUB_ENV

      - name: Pre-install NDK r27c
        continue-on-error: true
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION" || true

      - name: Verify Rust target availability
        run: |
          rustup target list --installed | grep "$RUST_TARGET" || {
            echo "::error::Rust target $RUST_TARGET missing"
            exit 1
          }
          echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN"
          rustc --version

      - name: Install Chaquopy build requirements
        run: |
          pip install -r $CHAQUOPY_ROOT/server/pypi/requirements.txt

      - name: Apply Chaquopy build-wheel.py patches
        run: python3 $GITHUB_WORKSPACE/scripts/patch-build-wheel.py

      - name: Download Android Python target
        run: |
          cd $CHAQUOPY_ROOT
          ./target/download-target.sh \
            maven/com/chaquo/python/target/${{ inputs.python_target_version }}
          find $CHAQUOPY_ROOT/maven -name "*.zip" -exec ls -la {} \;

      - name: Inject sysconfigdata into target zip
        run: |
          bash $GITHUB_WORKSPACE/scripts/inject-sysconfig.sh \
            "${{ inputs.python }}" "${{ inputs.python_target_version }}"

      - name: Download Chaquopy prebuilt deps
        run: bash $GITHUB_WORKSPACE/scripts/download-deps.sh

      - name: Build packages
        env:
          CARGO_BUILD_JOBS: "2"
          PYTHON_VER: ${{ inputs.python }}
          PACKAGES_INPUT: ${{ inputs.packages }}
          SINGLE_PACKAGE: ${{ inputs.package }}
          SINGLE_VERSION: ${{ inputs.version }}
        run: bash $GITHUB_WORKSPACE/scripts/build-packages.sh

      - name: Upload wheel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ github.run_number }}
          path: /tmp/all-wheels/*.whl
          if-no-files-found: error
          retention-days: 90

      - name: Upload to GitHub Release (latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Builds"
          body: "Auto-built Android arm64 wheels."
          files: /tmp/all-wheels/*.whl
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
