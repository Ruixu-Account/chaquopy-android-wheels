name: Dump AstrBot deps

on:
  workflow_dispatch:
    inputs:
      astrbot_version:
        description: 'AstrBot version (leave empty for latest)'
        required: false
        default: ''
      python:
        description: 'Python version'
        required: true
        default: '3.12'
        type: choice
        options:
          - '3.12'
          - '3.11'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}

      - name: Install AstrBot
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          if [ -n "${{ inputs.astrbot_version }}" ]; then
            /tmp/venv/bin/pip install "astrbot==${{ inputs.astrbot_version }}"
          else
            /tmp/venv/bin/pip install astrbot
          fi
      - name: Clone Chaquopy 17.0.0
        run: |
          git clone --depth 1 --branch 17.0.0 --recurse-submodules \
            https://github.com/chaquo/chaquopy.git /opt/chaquopy
          cd /opt/chaquopy
          git submodule update --init --recursive || true
          echo "=== /opt/chaquopy 顶层 ==="
          ls -la /opt/chaquopy/
          echo "=== server/pypi ==="
          ls -la /opt/chaquopy/server/pypi/
          echo "=== packages ==="
          ls /opt/chaquopy/server/pypi/packages/ 2>&1 | head -50 || echo "packages missing"
          ls /opt/chaquopy/server/pypi/packages/ | head -20
          echo "---"
          ls -d /opt/chaquopy/server/pypi/packages/{lxml,pillow,numpy,cffi} 2>&1
      - name: Freeze
        run: |
          /tmp/venv/bin/pip freeze > requirements.txt
          echo "=== requirements.txt ==="
          cat requirements.txt

      - name: Classify (pure python vs native)
        run: |
          echo "=== 需要编译的包（Linux 下是 wheel 但 PyPI 上有 sdist 的）==="
          while read line; do
            pkg=$(echo "$line" | cut -d= -f1)
            ver=$(echo "$line" | cut -d= -f3)
            json=$(curl -s "https://pypi.org/pypi/$pkg/$ver/json")
            has_sdist=$(echo "$json" | jq -r '[.urls[] | select(.packagetype=="sdist")] | length')
            has_native=$(echo "$json" | jq -r '[.urls[] | select(.packagetype=="bdist_wheel" and (.filename | test("cp312.*(manylinux|musllinux)")))] | length')
            if [ "$has_native" != "0" ]; then
              echo "🔥 $line"
            fi
          done < requirements.txt
          
      - name: List Chaquopy built-in recipes
        run: |
          echo "=== 官方 recipe 列表 ==="
          ls /opt/chaquopy/server/pypi/packages/ | sort
          echo ""
          echo "=== 我们要找的 ==="
          for p in lxml pillow numpy pandas libxml2 libxslt libjpeg libpng freetype zlib libffi openssl cffi; do
            if [ -d "/opt/chaquopy/server/pypi/packages/$p" ]; then
              echo "✅ $p"
            else
              echo "❌ $p"
            fi
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: astrbot-requirements-${{ inputs.python }}
          path: requirements.txt
          retention-days: 30
